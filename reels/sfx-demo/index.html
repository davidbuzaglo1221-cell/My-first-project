<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Frank;src:url(../barber-story/public/frank-ruhl-libre-hebrew-900-normal.woff2)}
@font-face{font-family:Heebo;font-weight:400;src:url(../barber-story/public/heebo-hebrew-400-normal.woff2)}
@font-face{font-family:Heebo;font-weight:800;src:url(../barber-story/public/heebo-hebrew-800-normal.woff2)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0b0907}
#stage{position:absolute;inset:0;overflow:hidden;background:#0b0907}
.shot{position:absolute;inset:-6%;background-size:cover;background-position:center;opacity:0;will-change:transform,filter}
.grade{filter:sepia(.38) saturate(.72) contrast(1.14) brightness(.9)}
#rgbR,#rgbB{position:absolute;inset:-6%;background-size:cover;opacity:0;mix-blend-mode:screen}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.62) 100%);pointer-events:none}
#leak{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 80% 30%,rgba(255,190,110,.75),rgba(255,120,40,.25) 35%,rgba(0,0,0,0) 65%);mix-blend-mode:screen}
#flash{position:absolute;inset:0;background:#fff8ec;opacity:0}
#black{position:absolute;inset:0;background:#0b0907;opacity:0}
#grain{position:absolute;inset:0;opacity:.11;mix-blend-mode:overlay}
.word{position:absolute;left:0;right:0;text-align:center;color:#f3e9d8;font-family:Frank;font-size:190px;line-height:1;letter-spacing:-2px;opacity:0;text-shadow:0 6px 40px rgba(0,0,0,.55)}
.small{font-family:Heebo;font-weight:400;font-size:40px;letter-spacing:6px;color:#d9c7a6}
#tag{position:absolute;right:84px;bottom:330px;display:flex;align-items:center;gap:22px;font-family:Heebo;font-weight:400;font-size:34px;color:#efe3cf;letter-spacing:2px;opacity:0}
#tag i{display:block;width:64px;height:2px;background:#c9a46a}
#tag b{font-weight:800;color:#c9a46a;font-family:Heebo;letter-spacing:1px}
#slices{position:absolute;inset:0;pointer-events:none}
#slices div{position:absolute;left:0;right:0;background-size:1080px 1920px;opacity:0}
</style></head><body>
<div id="stage">
  <div id="shots"></div>
  <div id="rgbR"></div><div id="rgbB"></div>
  <div id="slices"></div>
  <div id="leak"></div>
  <div id="vig"></div>
  <canvas id="grain" width="540" height="960"></canvas>
  <div id="w1" class="word" style="top:620px">כל צליל</div>
  <div id="w2" class="word" style="top:820px">במקום שלו.</div>
  <div id="w3" class="word" style="top:860px;font-size:300px">חד.</div>
  <div id="w4" class="word" style="top:700px">סאונד.</div>
  <div id="w5" class="word" style="top:880px">תנועה.</div>
  <div id="w6" class="word" style="top:1060px">קצב.</div>
  <div id="e1" class="word" style="top:760px;font-size:150px">כל צליל<br>במקום שלו.</div>
  <div id="e2" class="word small" style="top:1130px">דוד בוזגלו · סאונד דיזיין</div>
  <div id="tag"><i></i><span id="tagtxt"></span></div>
  <div id="flash"></div><div id="black"></div>
</div>
<script>
const B = 60/123.046875;            // one beat of the track, seconds
const b = k => k*B;
const clamp=(x,a=0,c=1)=>Math.min(c,Math.max(a,x));
const ease=x=>1-Math.pow(1-clamp(x),3), easeIn=x=>Math.pow(clamp(x),3), inout=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const R=(s)=>{let h=1779033703^s;return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}};
// shots: image, beats [from,to), framing (x%,y% focus, base scale)
const SHOTS=[
 {img:'p08',a:0, z:12, s0:1.28,s1:1.12, x:52,y:42},     // hook: razor close-up
 {img:'p06',a:2, z:4,  s0:1.10,s1:1.02, x:40,y:45},     // whip in: clipper on beard
 {img:'p01',a:4, z:6,  s0:1.04,s1:1.10, x:55,y:40},     // glitch in: the mirror
 {img:'p07',a:6, z:8,  s0:1.14,s1:1.06, x:60,y:22},     // night: clocks
 {img:'p04',a:8, z:10, s0:1.02,s1:1.08, x:50,y:40},     // walk
 {img:'p05',a:10,z:12, s0:1.30,s1:1.04, x:50,y:30},     // reverse-zoom in: the master
 {img:'p02',a:12,z:14, s0:1.02,s1:1.02, x:50,y:40},     // snips (punch steps)
 {img:'p03',a:14,z:16, s0:1.06,s1:1.06, x:50,y:28},     // shutter
 {img:'p10',a:16,z:20, s0:1.00,s1:1.22, x:50,y:45},     // riser push
 {img:'p09',a:20,z:24, s0:1.14,s1:1.02, x:45,y:32},     // reveal
 {img:'p09',a:24,z:28, s0:1.10,s1:1.16, x:45,y:32, blur:22, dim:.45}, // words over blur
 {img:'p05',a:28,z:36, s0:1.05,s1:1.18, x:50,y:30, blur:16, dim:.72}, // end card backdrop
];
const TAGS=[[0,2,'צמצם · בום עמוק'],[2,4,'וווש · מכונת תספורת'],[4,6,'גליץ\' דיגיטלי'],[6,10,'אווירה אפלה · שעון · צעדים'],
 [10,12,'ריברס · באס'],[12,14,'מספריים'],[14,16,'צמצם מצלמה'],[16,20,'רייזר · מתח'],[20,24,'אימפקט · זכוכית · ניצוץ'],[24,28,'פופ · טיק · וווש'],[28,35,'דרופ · ניצוץ']];
const shotsEl=document.getElementById('shots');
SHOTS.forEach((s,i)=>{const d=document.createElement('div');d.className='shot grade';d.style.backgroundImage=`url(../barber-story/public/${s.img}.png)`;d.style.backgroundPosition=`${s.x}% ${s.y}%`;shotsEl.appendChild(d);s.el=d});
const sl=document.getElementById('slices');for(let i=0;i<7;i++){sl.appendChild(document.createElement('div'))}
const $=id=>document.getElementById(id);
const gctx=$('grain').getContext('2d');
function grain(seed){const r=R(seed),img=gctx.createImageData(540,960),d=img.data;for(let i=0;i<d.length;i+=4){const v=r()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}gctx.putImageData(img,0,0)}
function word(id,t,tin,tout,from=60){const e=$(id);const p=ease((t-tin)/0.18),q=tout?clamp((t-tout)/0.12):0;
  e.style.opacity=(t>=tin?p:0)*(1-q);e.style.transform=`translateY(${(1-p)*from}px) scale(${1+(1-p)*.06})`;e.style.filter=`blur(${(1-p)*14+q*10}px)`}
window.renderAt=function(t,frame){
  const k=t/B;
  SHOTS.forEach(s=>{s.el.style.opacity=0});
  let flash=0,black=0,leak=0,glitch=0;
  SHOTS.forEach((s,i)=>{
    if(k<s.a-0.6||k>=s.z+0.6)return;
    const p=clamp((k-s.a)/(s.z-s.a));let sc=s.s0+(s.s1-s.s0)*inout(p),tx=0,ty=0,bl=s.blur||0,op=(k>=s.a&&k<s.z)?1:0;
    // per-shot moves and transitions
    if(i===0){const h=ease((k)/0.5);sc+= (1-h)*.25; if(k<0.12)flash=1-k/0.12;}
    if(i===1){const w=(k-2)/0.35; if(k<2.35){tx=(1-ease(w))*1200; bl+= (1-ease(w))*40}}
    if(i===0&&k>1.7){const w=(k-1.7)/0.3;tx=-easeIn(w)*1200;bl+=easeIn(w)*40}
    if(i===2&&k<4.4){glitch=1-(k-4)/0.4}
    if(i===1&&k>3.75){glitch=Math.max(glitch,(k-3.75)/0.25)}
    if(i===3){bl=0} if(i===4){ty=Math.sin(k*Math.PI)*6}
    if(i===5){const w=(k-10)/1.2;sc=1.04+(1-ease(w))*.5;bl+=(1-ease(w))*18}
    if(i===4&&k>9.2){const w=(k-9.2)/0.8;sc*=1+easeIn(w)*.35;bl+=easeIn(w)*10}
    if(i===6){const steps=[12,12.5,13,13.5].filter(x=>k>=x).length;sc=1.02+steps*.07;const ph=k-[12,12.5,13,13.5][Math.max(0,steps-1)];sc+= (1-ease(ph/0.2))*.03}
    if(i===7){const shots=[14,14.5,15];shots.forEach(x=>{if(k>=x&&k<x+0.16)flash=Math.max(flash,1-(k-x)/0.16)});const n=shots.filter(x=>k>=x).length;s.el.style.backgroundPosition=`${[50,38,62][Math.max(0,n-1)]}% ${[28,22,34][Math.max(0,n-1)]}%`;sc=[1.06,1.22,1.4][Math.max(0,n-1)]}
    if(i===8){const amp=Math.pow(p,2.2)*16;const r=R(frame*7+3);tx=(r()-.5)*amp;ty=(r()-.5)*amp; if(k>19.88&&k<20)flash=Math.max(flash,(k-19.88)/0.12)}
    if(i===9){sc=1.03+(1-ease((k-20)/1.1))*.24+clamp((k-21)/3)*.04;ty=(1-ease((k-20)/1.1))*-40; if(k>=20&&k<20.18)flash=Math.max(flash,1-(k-20)/0.18); if(k>=22&&k<23.6)leak=Math.sin(clamp((k-22)/1.6)*Math.PI)}
    if(i===10){op=k>=24&&k<28?1:0}
    if(i===11){op=k>=28?1:0}
    s.el.style.opacity=op;
    s.el.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
    s.el.style.filter=`sepia(.38) saturate(.72) contrast(1.14) brightness(${.9*(1-(s.dim||0))}) blur(${bl}px)`;
  });
  // glitch: RGB split + horizontal slices of the visible shot
  const vis=SHOTS.find(s=>k>=s.a&&k<s.z);
  const gR=$('rgbR'),gB=$('rgbB');
  if(glitch>0&&vis){const r=R(frame*13+1);const off=40*glitch*(r()>.3?1:-1);
    [gR,gB].forEach((g,j)=>{g.style.backgroundImage=vis.el.style.backgroundImage;g.style.backgroundPosition=vis.el.style.backgroundPosition;g.style.opacity=.55*glitch;
      g.style.transform=`translate(${j?-off:off}px,0) scale(1.06)`;g.style.filter=j?'sepia(1) hue-rotate(170deg) saturate(4) brightness(.8)':'sepia(1) hue-rotate(-40deg) saturate(5) brightness(.8)'});
    [...sl.children].forEach((d,j)=>{const y=r()*1920,h=20+r()*120;d.style.top=y+'px';d.style.height=h+'px';d.style.backgroundImage=vis.el.style.backgroundImage;
      d.style.backgroundPosition=`${-(r()-.5)*160*glitch}px ${-y}px`;d.style.opacity=r()<glitch?1:0;d.style.filter='sepia(.4) contrast(1.4)'});
  } else {gR.style.opacity=0;gB.style.opacity=0;[...sl.children].forEach(d=>d.style.opacity=0)}
  // words
  word('w1',t,b(0.08),b(1.75));word('w2',t,b(1),b(1.75));
  word('w3',t,b(20.05),b(23.8),0);$('w3').style.transform+=` scale(${1+clamp((k-20)/4)*.08})`;
  word('w4',t,b(24),b(27.8));word('w5',t,b(25),b(27.8));word('w6',t,b(26),b(27.8));
  word('e1',t,b(28),null,40);word('e2',t,b(29.5),null,20);$('e1').style.transform+=` scale(${1+clamp((k-28)/8)*.05})`;
  black=0;
  $('flash').style.opacity=clamp(flash);$('black').style.opacity=clamp(black)*(k<28?1:0);
  $('leak').style.opacity=leak*.9;
  // sound tag
  const tg=TAGS.find(x=>k>=x[0]&&k<x[1]);const tag=$('tag');
  if(tg&&k<28){$('tagtxt').textContent=tg[2];const p=ease((k-tg[0])/0.3);tag.style.opacity=p*(1-clamp((k-(tg[1]-0.2))/0.2));tag.style.transform=`translateX(${(1-p)*-30}px)`} else tag.style.opacity=0;
  grain(frame);
};
window.ready=document.fonts.ready.then(()=>Promise.all([...document.querySelectorAll('.shot')].map(()=>1)));
</script></body></html>

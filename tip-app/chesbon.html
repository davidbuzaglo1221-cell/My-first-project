<title>חשבון, בבקשה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300..600&family=IBM+Plex+Sans+Hebrew:wght@200;300;400;500;600&display=swap">
<style>
/* Layout: one phone-width column. The answer lives at the top, the keypad in the thumb zone. */
:root{
  --bg:#0E1A15; --raise:#16271F; --line:rgba(220,232,222,.10); --line-strong:rgba(220,232,222,.20);
  --ink:#ECE7DA; --muted:#8EA295; --faint:#5F7368; --brass:#D0AA62; --on-brass:#171106;
  --f-display:"Frank Ruhl Libre","David","Times New Roman",serif;
  --f-ui:"IBM Plex Sans Hebrew","Heebo","Arial Hebrew",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EDF0EA; --raise:#E1E6DE; --line:rgba(16,38,28,.11); --line-strong:rgba(16,38,28,.22);
  --ink:#0F231A; --muted:#55685D; --faint:#8A998F; --brass:#86621F; --on-brass:#FFF8EA; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#EDF0EA; --raise:#E1E6DE; --line:rgba(16,38,28,.11); --line-strong:rgba(16,38,28,.22);
  --ink:#0F231A; --muted:#55685D; --faint:#8A998F; --brass:#86621F; --on-brass:#FFF8EA; color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums lining-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:8px}
bdi{unicode-bidi:isolate}

.app{min-height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:10px 14px}

.top{display:flex;align-items:center;justify-content:space-between;height:44px}
.brand{margin:0;font-family:var(--f-display);font-weight:500;font-size:19px;letter-spacing:.005em}
.brand i{font-style:normal;color:var(--brass)}
.ghost{font-size:14px;color:var(--muted);padding:8px 2px}
.ghost:hover{color:var(--ink)}

/* Hero: the one number */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:190px;padding-block:8px 18px}
.hero-label{margin:0;font-family:var(--f-display);font-size:20px;color:var(--muted)}
.amount{direction:ltr;display:flex;justify-content:flex-end;align-items:flex-start;line-height:.84;
  font-family:var(--f-display);font-weight:380;font-size:clamp(84px,27vw,128px);letter-spacing:-.02em}
.amount .cur{font-family:var(--f-ui);font-size:.27em;font-weight:300;color:var(--muted);margin:.24em .16em 0 0;letter-spacing:0}
.amount .dec{font-size:.36em;color:var(--muted);margin:.06em 0 0 .04em;letter-spacing:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.amount .ch{display:inline-block}
.amount .ch.in{animation:rise .34s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(.22em);opacity:0}}
.hero.empty .amount .int{color:var(--muted)}
.hero-sub{margin:0;font-size:15px;color:var(--muted);min-height:1.4em}
.hero-sub b{font-weight:500;color:var(--ink)}
.split{display:flex;gap:0;margin-top:2px}
.split > div{flex:1;display:flex;flex-direction:column;gap:2px}
.split > div + div{border-inline-start:1px solid var(--line);padding-inline-start:16px}
.split > div:first-child{padding-inline-end:16px}
.split small{font-size:13px;color:var(--muted)}
.split strong{direction:ltr;text-align:right;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;color:var(--ink)}
.split strong .c{font-family:var(--f-ui);font-size:.5em;font-weight:300;color:var(--muted);margin-right:3px}
.split .cash strong{color:var(--brass)}
.hero-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.copy{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--brass);padding:6px 0}
.copy svg{width:16px;height:16px}
.copy[disabled]{opacity:.35;cursor:default}

/* Controls */
.row{border-top:1px solid var(--line);min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.label{font-size:15px;color:var(--muted)}
.bill{width:100%;text-align:start}
.bill-val{direction:ltr;font-family:var(--f-display);font-size:28px;font-weight:400;display:flex;align-items:center}
.bill-val .c{font-family:var(--f-ui);font-size:.5em;font-weight:300;color:var(--muted);margin-right:4px}
.caret{width:2px;height:26px;background:var(--brass);margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.chip{font-size:12px;letter-spacing:.04em;color:var(--brass)}
.bill-side{display:flex;align-items:center;gap:10px}
.msg{font-size:13px;color:var(--brass)}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}

.tip{border-top:1px solid var(--line);padding-top:12px}
.tip-head{display:flex;align-items:baseline;justify-content:space-between}
.pct{direction:ltr;text-align:center;font-family:var(--f-display);font-size:34px;font-weight:420;line-height:1;margin-top:-6px}
.pct small{font-family:var(--f-ui);font-size:.46em;font-weight:300;color:var(--muted);margin-left:1px}
.desc{font-size:14px;color:var(--brass);transition:opacity .2s}
.ruler-wrap{position:relative;margin-top:6px}
.needle{position:absolute;left:50%;top:-2px;width:2px;height:26px;background:var(--brass);border-radius:2px;transform:translateX(-50%);pointer-events:none;z-index:1}
.ruler{direction:ltr;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:52px;cursor:grab;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(to right,transparent,#000 22%,#000 78%,transparent)}
.ruler::-webkit-scrollbar{display:none}
.ruler.drag{cursor:grabbing;scroll-snap-type:none}
.track{display:flex;width:max-content;padding-inline:calc(50% - 8px)}
.tick{flex:0 0 16px;height:52px;scroll-snap-align:center;position:relative}
.tick::before{content:"";position:absolute;left:50%;top:4px;width:1px;height:10px;background:var(--faint);opacity:.6;transform:translateX(-50%)}
.tick.major::before{height:18px;background:var(--muted);opacity:.9}
.tick span{position:absolute;top:28px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted)}

.stepper{display:flex;align-items:center;gap:6px;direction:ltr}
.step{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-size:20px;font-weight:300}
.step:active{background:var(--raise)}
.step[disabled]{opacity:.3;cursor:default}
.count{min-width:44px;text-align:center;font-family:var(--f-display);font-size:26px;font-weight:400}

.switches{gap:0;align-items:stretch}
.sw{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;color:var(--muted);padding-block:6px;transition:color .2s}
.sw + .sw{border-inline-start:1px solid var(--line);padding-inline-start:16px}
.sw:first-child{padding-inline-end:16px}
.sw i{flex:none;width:34px;height:20px;border-radius:99px;background:var(--raise);box-shadow:inset 0 0 0 1px var(--line-strong);position:relative;transition:background .22s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .26s cubic-bezier(.3,1.4,.5,1),background .22s}
.sw[aria-pressed="true"]{color:var(--ink)}
.sw[aria-pressed="true"] i{background:var(--brass);box-shadow:none}
.sw[aria-pressed="true"] i::after{transform:translateX(14px);background:var(--on-brass)}

/* Keypad */
.keypad{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px}
.key{height:clamp(46px,6.6vh,56px);border-radius:14px;font-size:27px;font-weight:300;display:grid;place-items:center;transition:background .12s}
.key:active,.key.hit{background:var(--raise)}
.key svg{width:26px;height:26px}
.key[data-k="."]{font-size:36px;line-height:0;padding-bottom:12px}
@media (max-height:740px){
  .app{padding-block:4px 8px} .top{height:38px}
  .hero{min-height:0;padding-block:0 8px;gap:5px}
  .split strong{font-size:24px}
  .amount{font-size:clamp(72px,23vw,104px)}
  .row{min-height:46px} .tip{padding-top:6px} .ruler{height:42px} .tick{height:42px} .tick span{top:24px}
  .step{width:36px;height:36px} .pct{font-size:30px}
  .keypad{margin-top:6px}
}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;
  background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;padding:10px 16px;border-radius:99px;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<main class="app">
  <header class="top">
    <h1 class="brand">חשבון<i>,</i> בבקשה</h1>
    <button class="ghost" id="reset" type="button">חשבון חדש</button>
  </header>

  <section class="hero" id="hero" aria-live="polite" aria-atomic="true">
    <div class="hero-head">
      <p class="hero-label" id="heroLabel">כל אחד משלם</p>
      <button class="copy" id="copy" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>
        העתקה לקבוצה
      </button>
    </div>
    <span class="sr" id="srAmount"></span>
    <div class="amount" id="amount" aria-hidden="true"><span class="cur">₪</span><span class="int" id="int"></span><span class="dec" id="dec"></span></div>
    <p class="hero-sub" id="sub" hidden></p>
    <div class="split" id="split" hidden>
      <div><small>בכרטיס, לכל אחד</small><strong id="cardAmt"></strong></div>
      <div class="cash"><small>במזומן, לכל אחד</small><strong id="cashAmt"></strong></div>
    </div>
  </section>

  <section aria-label="פרטי החשבון">
    <div class="row" id="billRow">
      <span class="label">החשבון</span>
      <span class="bill-side">
        <span class="msg" id="msg" hidden></span>
        <span class="chip" id="chip">דוגמה</span>
        <span class="bill-val"><span class="c">₪</span><span id="billVal"></span><span class="caret" aria-hidden="true"></span></span>
      </span>
    </div>

    <div class="tip">
      <div class="tip-head">
        <span class="label">טיפ</span>
        <span class="desc" id="desc"></span>
      </div>
      <div class="pct" id="pct"></div>
      <div class="ruler-wrap">
        <span class="needle" aria-hidden="true"></span>
        <div class="ruler" id="ruler" role="slider" tabindex="0" aria-label="אחוז טיפ" aria-valuemin="0" aria-valuemax="30">
          <div class="track" id="track"></div>
        </div>
      </div>
    </div>

    <div class="row">
      <span class="label">סועדים</span>
      <span class="stepper">
        <button class="step" id="minus" type="button" aria-label="פחות סועדים">−</button>
        <span class="count" id="count"></span>
        <button class="step" id="plus" type="button" aria-label="עוד סועד">+</button>
      </span>
    </div>

    <div class="row switches">
      <button class="sw" id="tgRound" type="button" aria-pressed="false"><span>עיגול למעלה</span><i aria-hidden="true"></i></button>
      <button class="sw" id="tgCash" type="button" aria-pressed="false"><span>טיפ במזומן</span><i aria-hidden="true"></i></button>
    </div>
  </section>

  <section class="keypad" id="keypad" aria-label="מקלדת סכום">
    <button class="key" data-k="1" type="button">1</button><button class="key" data-k="2" type="button">2</button><button class="key" data-k="3" type="button">3</button>
    <button class="key" data-k="4" type="button">4</button><button class="key" data-k="5" type="button">5</button><button class="key" data-k="6" type="button">6</button>
    <button class="key" data-k="7" type="button">7</button><button class="key" data-k="8" type="button">8</button><button class="key" data-k="9" type="button">9</button>
    <button class="key" data-k="." type="button" aria-label="נקודה עשרונית">.</button><button class="key" data-k="0" type="button">0</button>
    <button class="key" data-k="back" type="button" aria-label="מחיקה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg></button>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const MAX_TIP = 30, TICK = 16, KEY = 'chesbon.v1';
  const S = { bill: '304', sample: true, tip: 12, n: 3, round: false, cash: false };
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ tip: S.tip, n: S.n, round: S.round, cash: S.cash })); } catch (e) {} };

  const toAg = s => { if (!s) return 0; const [i, d = ''] = s.split('.'); return (parseInt(i || '0', 10) * 100) + parseInt((d + '00').slice(0, 2), 10); };
  const parts = a => ({ i: Math.floor(a / 100).toLocaleString('en-US'), d: String(a % 100).padStart(2, '0') });
  const money = a => { const p = parts(a); return '₪' + p.i + (p.d === '00' ? '' : '.' + p.d); };
  const bdi = s => '<bdi>' + s + '</bdi>';
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  function describe(t) {
    if (t === 0) return 'בלי טיפ';
    if (t < 10) return 'פחות מהמקובל';
    if (t <= 12) return 'המקובל בישראל';
    if (t <= 15) return 'שירות טוב מאוד';
    if (t < 20) return 'שירות מצוין';
    return 'נדיב במיוחד';
  }

  function compute() {
    const B = toAg(S.bill), tip = Math.round(B * S.tip / 100);
    let per = Math.ceil((B + tip) / S.n), card = 0, cash = 0;
    if (S.cash) {
      card = Math.ceil(B / S.n); cash = Math.ceil(tip / S.n);
      if (S.round) cash = Math.ceil(cash / 100) * 100;
      per = card + cash;
    } else if (S.round) per = Math.ceil(per / 100) * 100;
    const paid = per * S.n, effTip = paid - B;
    return { B, per, card, cash, paid, effTip, effPct: B ? effTip / B * 100 : 0 };
  }

  let prevInt = '';
  function renderAmount(a) {
    const p = parts(a), el = $('int');
    const next = p.i, prev = prevInt;
    el.innerHTML = '';
    for (let k = 0; k < next.length; k++) {
      const s = document.createElement('span');
      s.className = 'ch'; s.textContent = next[k];
      const fromEnd = next.length - k, old = prev[prev.length - fromEnd];
      if (prev && old !== next[k]) s.classList.add('in');
      el.appendChild(s);
    }
    prevInt = next;
    $('dec').textContent = p.d === '00' ? '' : p.d;
    $('srAmount').textContent = money(a);
  }

  function update() {
    const r = compute();
    $('billVal').textContent = S.bill ? S.bill.replace(/^(\d+)/, m => Number(m).toLocaleString('en-US')) : '0';
    $('chip').hidden = !S.sample;
    $('count').textContent = S.n;
    $('minus').disabled = S.n <= 1; $('plus').disabled = S.n >= 30;
    $('pct').innerHTML = S.tip + '<small>%</small>';
    $('desc').textContent = describe(S.tip);
    $('ruler').setAttribute('aria-valuenow', S.tip);
    $('ruler').setAttribute('aria-valuetext', S.tip + '% · ' + describe(S.tip));
    $('tgRound').setAttribute('aria-pressed', S.round); $('tgCash').setAttribute('aria-pressed', S.cash);
    $('heroLabel').textContent = S.n === 1 ? 'סה״כ לתשלום' : 'כל אחד משלם';

    const empty = r.B === 0;
    $('hero').classList.toggle('empty', empty);
    $('copy').disabled = empty;
    renderAmount(empty ? 0 : r.per);
    if (empty) $('sub').textContent = 'הקלידו את סכום החשבון';
    else if (S.cash) $('sub').textContent = '';
    else {
      const pct = S.round ? (Math.round(r.effPct * 10) / 10) : S.tip;
      $('sub').innerHTML = 'סה״כ <b>' + bdi(money(r.paid)) + '</b> · טיפ ' + bdi(money(r.effTip)) + ' (' + bdi(pct + '%') + ')';
    }
    const showSplit = S.cash && !empty;
    $('sub').hidden = showSplit;
    $('split').hidden = !showSplit;
    if (showSplit) {
      const fig = a => '<span class="c">₪</span>' + parts(a).i + (a % 100 ? '.' + parts(a).d : '');
      $('cardAmt').innerHTML = fig(r.card); $('cashAmt').innerHTML = fig(r.cash);
    }
    save();
  }

  // Keypad
  let msgTimer;
  function reject(text) {
    const row = $('billRow'); row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
    $('msg').textContent = text; $('msg').hidden = false; buzz([12, 40, 12]);
    clearTimeout(msgTimer); msgTimer = setTimeout(() => { $('msg').hidden = true; }, 1800);
  }
  function press(k) {
    if (S.sample) { S.bill = ''; S.sample = false; }
    let b = S.bill;
    if (k === 'back') b = b.slice(0, -1);
    else if (k === '.') { if (b.includes('.')) return reject('כבר יש נקודה'); b = (b || '0') + '.'; }
    else {
      const [i, d] = b.split('.');
      if (d !== undefined && d.length >= 2) return reject('עד שתי ספרות אחרי הנקודה');
      if (d === undefined && i.length >= 5) return reject('עד ₪99,999');
      b = (b === '0') ? k : b + k;
    }
    S.bill = b; buzz(6); update();
  }
  $('keypad').addEventListener('click', e => { const k = e.target.closest('.key'); if (k) press(k.dataset.k); });

  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (document.activeElement === $('ruler') && /Arrow|Home|End/.test(e.key)) return;
    let k = null;
    if (/^[0-9]$/.test(e.key)) k = e.key; else if (e.key === '.' || e.key === ',') k = '.'; else if (e.key === 'Backspace' || e.key === 'Delete') k = 'back';
    if (k) { e.preventDefault(); press(k); const btn = document.querySelector('.key[data-k="' + k + '"]'); if (btn) { btn.classList.add('hit'); setTimeout(() => btn.classList.remove('hit'), 110); } return; }
    if (e.key === '+' ) { setN(S.n + 1); } else if (e.key === '-') { setN(S.n - 1); } else if (e.key === 'Escape') { resetBill(); }
  });

  // Diners
  function setN(n) { n = Math.max(1, Math.min(30, n)); if (n !== S.n) { S.n = n; buzz(6); update(); } }
  $('minus').onclick = () => setN(S.n - 1);
  $('plus').onclick = () => setN(S.n + 1);
  $('tgRound').onclick = () => { S.round = !S.round; buzz(6); update(); };
  $('tgCash').onclick = () => { S.cash = !S.cash; buzz(6); update(); };
  function resetBill() { S.bill = ''; S.sample = false; update(); }
  $('reset').onclick = resetBill;

  // Tip ruler
  const ruler = $('ruler'), track = $('track');
  for (let t = 0; t <= MAX_TIP; t++) {
    const tk = document.createElement('div');
    tk.className = 'tick' + (t % 5 === 0 ? ' major' : ''); tk.dataset.t = t;
    if (t % 5 === 0) tk.innerHTML = '<span>' + t + '</span>';
    track.appendChild(tk);
  }
  let lock = 0, lockTimer;
  const unlock = () => { lock = 0; };
  const setTip = (t, smooth) => {
    t = Math.max(0, Math.min(MAX_TIP, t));
    if (t !== S.tip) { S.tip = t; buzz(4); update(); }
    lock = 1; clearTimeout(lockTimer); lockTimer = setTimeout(unlock, smooth ? 500 : 60);
    ruler.scrollTo({ left: t * TICK, behavior: smooth ? 'smooth' : 'auto' });
  };
  let raf = 0;
  ruler.addEventListener('scroll', () => {
    if (lock) return;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const t = Math.max(0, Math.min(MAX_TIP, Math.round(ruler.scrollLeft / TICK)));
      if (t !== S.tip) { S.tip = t; buzz(4); update(); }
    });
  }, { passive: true });
  ruler.addEventListener('keydown', e => {
    const map = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 };
    if (e.key in map) { e.preventDefault(); setTip(S.tip + map[e.key], true); }
    if (e.key === 'Home') { e.preventDefault(); setTip(0, true); }
    if (e.key === 'End') { e.preventDefault(); setTip(MAX_TIP, true); }
  });
  track.addEventListener('click', e => { const tk = e.target.closest('.tick'); if (tk && !moved) setTip(+tk.dataset.t, true); });
  ruler.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); ruler.scrollLeft += e.deltaY; } }, { passive: false });
  let dragX = null, startLeft = 0, moved = false;
  ruler.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; dragX = e.clientX; startLeft = ruler.scrollLeft; moved = false; ruler.classList.add('drag'); ruler.setPointerCapture(e.pointerId); });
  ruler.addEventListener('pointermove', e => { if (dragX === null) return; const dx = e.clientX - dragX; if (Math.abs(dx) > 3) moved = true; ruler.scrollLeft = startLeft - dx; });
  const endDrag = () => { if (dragX === null) return; dragX = null; ruler.classList.remove('drag'); setTip(Math.round(ruler.scrollLeft / TICK), true); setTimeout(() => moved = false, 0); };
  ruler.addEventListener('pointerup', endDrag); ruler.addEventListener('pointercancel', endDrag);

  // Copy
  function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); }
  $('copy').onclick = async () => {
    const r = compute();
    const pctTxt = (S.round && !S.cash) ? Math.round(r.effPct * 10) / 10 : S.tip;
    const lines = ['חשבון, בבקשה', 'החשבון: ' + money(r.B) + ' · טיפ ' + pctTxt + '%', S.n + ' סועדים · סה״כ ' + money(r.paid)];
    lines.push(S.cash ? 'כל אחד: ' + money(r.card) + ' בכרטיס + ' + money(r.cash) + ' במזומן' : 'כל אחד: ' + money(r.per));
    const text = lines.join('\n');
    try { await navigator.clipboard.writeText(text); toast('הועתק. אפשר להדביק בקבוצה'); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
      ta.remove(); toast(ok ? 'הועתק. אפשר להדביק בקבוצה' : 'ההעתקה נחסמה בדפדפן הזה');
    }
  };

  update();
  requestAnimationFrame(() => setTip(S.tip, false));
})();
</script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#3a4256"/>
      <stop offset="0.6" stop-color="#1a1e29"/>
      <stop offset="1" stop-color="#090b10"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2030"/>
      <stop offset="1" stop-color="#07080c"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8404f"/>
      <stop offset="0.45" stop-color="#c8102e"/>
      <stop offset="1" stop-color="#7a0a1e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6b82"/>
      <stop offset="0.5" stop-color="#1b2433"/>
      <stop offset="1" stop-color="#0a0f18"/>
    </linearGradient>
    <radialGradient id="rim" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="0.6" stop-color="#aeb4bc"/>
      <stop offset="1" stop-color="#5d636c"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <clipPath id="bodyClip">
      <path d="M110 530 C110 490 115 445 150 425 C180 408 220 395 260 372 C330 330 420 262 520 250 C580 242 640 240 680 248 C740 262 790 310 820 352 C900 368 980 380 1040 396 C1090 410 1115 445 1115 480 C1115 515 1100 532 1075 534 L1000 536 L830 540 L380 540 L200 540 C150 540 110 540 110 530 Z"/>
    </clipPath>
  </defs>

  <!-- Studio background -->
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect y="600" width="1200" height="120" fill="url(#floor)"/>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#2f3646" stroke-width="2"/>

  <!-- Ground shadow -->
  <ellipse cx="600" cy="640" rx="560" ry="18" fill="#000" opacity="0.6" filter="url(#blur)"/>

  <!-- Body -->
  <path d="M110 530 C110 490 115 445 150 425 C180 408 220 395 260 372 C330 330 420 262 520 250 C580 242 640 240 680 248 C740 262 790 310 820 352 C900 368 980 380 1040 396 C1090 410 1115 445 1115 480 C1115 515 1100 532 1075 534 L1000 536 L830 540 L380 540 L200 540 C150 540 110 540 110 530 Z" fill="url(#body)"/>

  <g clip-path="url(#bodyClip)">
    <!-- Lower side shadow -->
    <rect x="90" y="500" width="1040" height="60" fill="#4a0612" opacity="0.45"/>
    <!-- Shoulder highlights -->
    <path d="M520 254 C600 244 660 246 700 256 C740 268 780 300 812 348 C880 362 960 374 1040 398" fill="none" stroke="#ffffff" stroke-width="9" opacity="0.35" filter="url(#soft)"/>
    <path d="M270 380 C330 344 400 290 480 262" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.25" filter="url(#soft)"/>
    <!-- Fender line -->
    <path d="M640 440 C720 426 800 424 880 438" fill="none" stroke="#5a0816" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Greenhouse glass (sloped 911 windshield and rear window) -->
  <path d="M292 370 C350 312 430 266 520 262 C580 258 640 258 690 264 C735 272 770 306 808 356 L640 346 L320 378 Z" fill="url(#glass)" stroke="#0a0c12" stroke-width="3"/>
  <path d="M400 318 C440 292 480 276 520 272" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.35" stroke-linecap="round"/>
  <!-- B-pillar and door line -->
  <path d="M612 344 L604 530" fill="none" stroke="#5a0816" stroke-width="4"/>
  <path d="M612 344 L604 530" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25" transform="translate(3,0)"/>
  <!-- Door handle -->
  <rect x="520" y="420" width="52" height="8" rx="4" fill="#1a1a1a"/>

  <!-- Side mirror -->
  <path d="M800 356 Q818 340 830 356 L816 368 Z" fill="#a50c24" stroke="#4a0612" stroke-width="2"/>

  <!-- Rear spoiler -->
  <path d="M190 398 L246 370 L254 380 L200 408 Z" fill="#1a1a1a"/>

  <!-- Rear light bar -->
  <path d="M116 446 L190 418 L192 434 L120 462 Z" fill="#ff2a2a"/>
  <path d="M116 446 L190 418 L192 434 L120 462 Z" fill="#ffffff" opacity="0.25" transform="translate(0,-2)"/>
  <path d="M112 448 L196 414" stroke="#ff4d4d" stroke-width="10" opacity="0.35" filter="url(#soft)"/>

  <!-- Round headlight on the fender top -->
  <circle cx="1080" cy="466" r="24" fill="#0d1017"/>
  <circle cx="1080" cy="466" r="19" fill="#e9f3ff"/>
  <circle cx="1080" cy="466" r="19" fill="none" stroke="#7d8fa8" stroke-width="2"/>
  <circle cx="1073" cy="459" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="1080" cy="466" r="32" fill="#cfe6ff" opacity="0.18" filter="url(#blur)"/>

  <!-- Front lower intake -->
  <path d="M1080 508 L1112 500 L1106 522 L1078 526 Z" fill="#111318"/>

  <!-- Wheel arches -->
  <circle cx="290" cy="562" r="92" fill="#050505"/>
  <circle cx="900" cy="562" r="92" fill="#050505"/>

  <!-- Rear wheel -->
  <g transform="translate(290,562)">
    <circle r="76" fill="#0c0c0e"/>
    <circle r="66" fill="#16181c"/>
    <circle r="52" fill="url(#rim)"/>
    <g fill="#6b717b">
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z"/>
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z" transform="rotate(72)"/>
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z" transform="rotate(144)"/>
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z" transform="rotate(216)"/>
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z" transform="rotate(288)"/>
    </g>
    <circle r="14" fill="#2a2d33"/>
    <circle r="5" fill="#c8102e"/>
    <circle r="50" fill="none" stroke="#2a2d33" stroke-width="2"/>
  </g>

  <!-- Front wheel -->
  <g transform="translate(900,562)">
    <circle r="76" fill="#0c0c0e"/>
    <circle r="66" fill="#16181c"/>
    <circle r="52" fill="url(#rim)"/>
    <g fill="#6b717b">
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z"/>
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z" transform="rotate(72)"/>
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z" transform="rotate(144)"/>
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z" transform="rotate(216)"/>
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z" transform="rotate(288)"/>
    </g>
    <circle r="14" fill="#2a2d33"/>
    <circle r="5" fill="#c8102e"/>
    <circle r="50" fill="none" stroke="#2a2d33" stroke-width="2"/>
  </g>

  <!-- Wheel arch lip shadow -->
  <path d="M190 548 A 100 100 0 0 1 390 548" fill="none" stroke="#000" stroke-width="4" opacity="0.5"/>
  <path d="M800 548 A 100 100 0 0 1 1000 548" fill="none" stroke="#000" stroke-width="4" opacity="0.5"/>

  <!-- Title -->
  <text x="60" y="78" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f2f4f8" letter-spacing="3">PORSCHE 911</text>
  <text x="60" y="108" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9aa3b5" letter-spacing="2">GUARDS RED · SIDE PROFILE</text>
</svg>

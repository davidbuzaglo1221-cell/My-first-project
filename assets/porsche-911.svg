<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#3a4256"/>
      <stop offset="0.6" stop-color="#1a1e29"/>
      <stop offset="1" stop-color="#090b10"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2030"/>
      <stop offset="1" stop-color="#07080c"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8404f"/>
      <stop offset="0.45" stop-color="#c8102e"/>
      <stop offset="1" stop-color="#7a0a1e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6b82"/>
      <stop offset="0.5" stop-color="#1b2433"/>
      <stop offset="1" stop-color="#0a0f18"/>
    </linearGradient>
    <radialGradient id="rim" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="0.6" stop-color="#aeb4bc"/>
      <stop offset="1" stop-color="#5d636c"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <clipPath id="bodyClip">
      <path d="M128 560 L128 470 C128 438 140 418 170 412 C230 404 300 390 380 370 C450 352 520 344 600 342 L690 342 C750 350 800 390 835 438 C920 452 980 462 1010 466 C1050 470 1076 490 1082 520 C1088 548 1086 572 1074 582 L900 590 L380 590 L150 590 C132 590 128 578 128 560 Z"/>
    </clipPath>
  </defs>

  <!-- Studio background -->
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect y="632" width="1200" height="88" fill="url(#floor)"/>
  <line x1="0" y1="632" x2="1200" y2="632" stroke="#2f3646" stroke-width="2"/>

  <!-- Ground shadow -->
  <ellipse cx="620" cy="642" rx="580" ry="16" fill="#000" opacity="0.6" filter="url(#blur)"/>

  <!-- Body -->
  <path d="M128 560 L128 470 C128 438 140 418 170 412 C230 404 300 390 380 370 C450 352 520 344 600 342 L690 342 C750 350 800 390 835 438 C920 452 980 462 1010 466 C1050 470 1076 490 1082 520 C1088 548 1086 572 1074 582 L900 590 L380 590 L150 590 C132 590 128 578 128 560 Z" fill="url(#body)"/>

  <g clip-path="url(#bodyClip)">
    <!-- Lower side shadow -->
    <rect x="110" y="548" width="1000" height="50" fill="#4a0612" opacity="0.45"/>
    <!-- Roof and deck highlights -->
    <path d="M330 390 C400 362 480 350 560 346" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.3" filter="url(#soft)"/>
    <path d="M610 346 L690 346 C750 354 790 390 820 430" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.3" filter="url(#soft)"/>
    <!-- Haunch and fender lines -->
    <path d="M250 478 C300 466 380 466 430 478" fill="none" stroke="#5a0816" stroke-width="3" opacity="0.6"/>
    <path d="M880 492 C930 474 990 472 1040 486" fill="none" stroke="#5a0816" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Greenhouse glass: sloped windshield and rear window -->
  <path d="M300 400 C380 370 460 354 540 350 L680 350 C742 360 792 398 826 446 C760 456 700 462 640 466 L440 478 L330 468 Z" fill="url(#glass)" stroke="#0a0c12" stroke-width="3"/>
  <path d="M400 380 C440 364 490 356 530 354" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.35" stroke-linecap="round"/>

  <!-- Door shut line and handle -->
  <path d="M612 466 L606 590" fill="none" stroke="#5a0816" stroke-width="4"/>
  <path d="M612 466 L606 590" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25" transform="translate(3,0)"/>
  <rect x="520" y="516" width="50" height="8" rx="4" fill="#1a1a1a"/>

  <!-- Side mirror at the base of the windshield -->
  <path d="M826 450 Q840 436 854 446 L848 462 Z" fill="#a50c24" stroke="#4a0612" stroke-width="2"/>

  <!-- Rear spoiler lip at the back of the deck -->
  <path d="M178 414 L214 402 L217 410 L181 422 Z" fill="#1a1a1a"/>

  <!-- Rear light bar -->
  <path d="M132 470 L186 432 L190 446 L137 484 Z" fill="#ff2a2a"/>
  <path d="M132 470 L186 432 L190 446 L137 484 Z" fill="#ffffff" opacity="0.25" transform="translate(0,-2)"/>
  <path d="M128 472 L192 430" stroke="#ff4d4d" stroke-width="10" opacity="0.35" filter="url(#soft)"/>

  <!-- Round headlight on the front fender -->
  <circle cx="1028" cy="486" r="20" fill="#0d1017"/>
  <circle cx="1028" cy="486" r="16" fill="#e9f3ff"/>
  <circle cx="1028" cy="486" r="16" fill="none" stroke="#7d8fa8" stroke-width="2"/>
  <circle cx="1022" cy="480" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="1028" cy="486" r="28" fill="#cfe6ff" opacity="0.18" filter="url(#blur)"/>

  <!-- Front lower intake -->
  <path d="M1058 552 L1080 544 L1078 562 L1056 568 Z" fill="#111318"/>

  <!-- Wheel arches -->
  <circle cx="348" cy="556" r="92" fill="#050505"/>
  <circle cx="892" cy="556" r="92" fill="#050505"/>

  <!-- Rear wheel -->
  <g transform="translate(348,556)">
    <circle r="76" fill="#0c0c0e"/>
    <circle r="66" fill="#16181c"/>
    <circle r="52" fill="url(#rim)"/>
    <g fill="#6b717b">
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z"/>
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z" transform="rotate(72)"/>
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z" transform="rotate(144)"/>
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z" transform="rotate(216)"/>
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z" transform="rotate(288)"/>
    </g>
    <circle r="14" fill="#2a2d33"/>
    <circle r="5" fill="#c8102e"/>
    <circle r="50" fill="none" stroke="#2a2d33" stroke-width="2"/>
  </g>

  <!-- Front wheel -->
  <g transform="translate(892,556)">
    <circle r="76" fill="#0c0c0e"/>
    <circle r="66" fill="#16181c"/>
    <circle r="52" fill="url(#rim)"/>
    <g fill="#6b717b">
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z"/>
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z" transform="rotate(72)"/>
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z" transform="rotate(144)"/>
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z" transform="rotate(216)"/>
      <path d="M-9 -10 L9 -10 L15 -50 L-15 -50 Z" transform="rotate(288)"/>
    </g>
    <circle r="14" fill="#2a2d33"/>
    <circle r="5" fill="#c8102e"/>
    <circle r="50" fill="none" stroke="#2a2d33" stroke-width="2"/>
  </g>

  <!-- Wheel arch lip shadow -->
  <path d="M256 556 A 92 92 0 0 1 440 556" fill="none" stroke="#000" stroke-width="4" opacity="0.5"/>
  <path d="M800 556 A 92 92 0 0 1 984 556" fill="none" stroke="#000" stroke-width="4" opacity="0.5"/>

  <!-- Title -->
  <text x="60" y="78" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f2f4f8" letter-spacing="3">PORSCHE 911</text>
  <text x="60" y="108" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#9aa3b5" letter-spacing="2">GUARDS RED · SIDE PROFILE</text>
</svg>

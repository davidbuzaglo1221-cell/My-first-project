<style>
/* Layout: one column "radio" app. Generative topic covers carry the visual identity; text kept to labels. */
:root {
  --bg: #0d1517; --bg2: #121d20; --surface: #18262a; --surface2: #203236;
  --ink: #edf1ec; --muted: #93a3a0; --line: rgba(237,241,236,.10);
  --accent: #f2b75b; --accent-ink: #1b1305; --good: #7fd6a4; --warn: #f08a6c;
  --display: "Karantina", "Heebo", "Arial Hebrew", system-ui, sans-serif;
  --body: "Heebo", "Arial Hebrew", system-ui, sans-serif;
  --r: 22px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eef3f1; --bg2: #e3ebe8; --surface: #ffffff; --surface2: #f1f6f4;
  --ink: #102022; --muted: #56706c; --line: rgba(16,32,34,.11);
  --accent: #b06a10; --accent-ink: #fffaf1; --good: #1f8a53; --warn: #b8462a; color-scheme: light } }
:root[data-theme="light"] {
  --bg: #eef3f1; --bg2: #e3ebe8; --surface: #ffffff; --surface2: #f1f6f4;
  --ink: #102022; --muted: #56706c; --line: rgba(16,32,34,.11);
  --accent: #b06a10; --accent-ink: #fffaf1; --good: #1f8a53; --warn: #b8462a; color-scheme: light }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { background: var(--bg); color: var(--ink) }
body { font-family: var(--body); font-size: 16px; line-height: 1.5; min-height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg) }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0 }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px }
#app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 140px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; padding-block: 12px; background: var(--bg); }
.brand { font-family: var(--display); font-size: 34px; font-weight: 700; letter-spacing: .5px; line-height: 1 }
.brand b { color: var(--accent); font-weight: 700 }
.iconbtn { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); }
.iconbtn svg { width: 22px; height: 22px }
.burger span { display: block; width: 20px; height: 2px; background: var(--ink); border-radius: 2px; margin: 4px 0 }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .25s }
.scrim.on { opacity: 1; pointer-events: auto }
.drawer { position: fixed; top: 0; bottom: 0; right: 0; width: min(86vw, 380px); background: var(--bg2); z-index: 41; transform: translateX(105%); transition: transform .3s cubic-bezier(.2,.8,.2,1); padding: calc(env(safe-area-inset-top, 0px) + 18px) max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px }
.drawer.on { transform: none }
.drawer h2 { font-family: var(--display); font-size: 30px; margin: 0 0 8px; font-weight: 700 }
.navitem { display: flex; align-items: center; gap: 14px; padding: 10px 8px; border-radius: 16px; text-align: right; width: 100% }
.navitem:hover, .navitem.cur { background: var(--surface) }
.navitem canvas { width: 46px; height: 46px; border-radius: 14px; flex: none }
.navitem .t { font-weight: 700; font-size: 17px }
.navitem .s { color: var(--muted); font-size: 13px }
.navitem .meter { margin-inline-start: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.navsep { height: 1px; background: var(--line); margin: 10px 0 }
.navicon { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--surface); flex: none }
.navicon svg { width: 22px; height: 22px }

/* home */
.hero { margin-top: 6px; border-radius: 28px; overflow: hidden; position: relative; background: var(--surface); min-height: 210px; display: flex; align-items: flex-end }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; max-width: 100% }
.hero .in { position: relative; padding: 20px; display: flex; align-items: flex-end; justify-content: space-between; width: 100%; gap: 12px }
.hero .date { font-size: 13px; color: #fff; opacity: .85 }
.hero .hi { font-family: var(--display); font-size: 46px; line-height: .95; color: #fff; text-wrap: balance }
.bigplay { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; box-shadow: 0 10px 30px rgba(0,0,0,.35) }
.bigplay svg { width: 30px; height: 30px }
.sec { margin-top: 26px }
.sechead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px }
.sechead h3 { margin: 0; font-family: var(--display); font-size: 30px; font-weight: 700; letter-spacing: .3px }
.sechead .aux { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums }
.tasks { display: grid; gap: 10px }
.task { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 18px; padding: 12px 14px; min-height: 64px }
.task .dot { width: 10px; height: 10px; border-radius: 50%; flex: none }
.task .txt { flex: 1; min-width: 0; font-size: 15px; line-height: 1.35 }
.task.done .txt { color: var(--muted); text-decoration: line-through }
.task .act { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface2); flex: none }
.task .act svg { width: 18px; height: 18px }
.task .check.on { background: var(--good); color: #062214 }
.task.ai { outline: 1px dashed var(--accent); outline-offset: -1px }
.row { display: flex; gap: 10px; flex-wrap: wrap }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: var(--surface); font-weight: 600; font-size: 14px }
.pill svg { width: 18px; height: 18px }
.pill.accent { background: var(--accent); color: var(--accent-ink) }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px }
.tile { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 1 / 1.05; max-width: 100%; background: var(--surface); text-align: right }
.tile canvas { position: absolute; inset: 0; width: 100%; height: 100% }
.tile .lab { position: absolute; inset: auto 0 0 0; padding: 12px; background: linear-gradient(transparent, rgba(0,0,0,.55)); color: #fff }
.tile .lab b { font-family: var(--display); font-size: 30px; font-weight: 700; display: block; line-height: 1 }
.tile .lab small { opacity: .85; font-size: 12px; font-variant-numeric: tabular-nums }
.streak { display: flex; gap: 6px; align-items: flex-end }
.streak i { width: 100%; flex: 1; height: 34px; border-radius: 8px; background: var(--surface) }
.streak i.on { background: var(--accent) }
.streak i.today { outline: 2px solid var(--ink); outline-offset: 1px }

/* topic */
.cover { position: relative; border-radius: 28px; overflow: hidden; aspect-ratio: 1.25 / 1; max-width: 100%; margin-top: 6px }
.cover canvas { position: absolute; inset: 0; width: 100%; height: 100% }
.cover .in { position: absolute; inset: auto 0 0 0; padding: 20px; color: #fff; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; background: linear-gradient(transparent, rgba(0,0,0,.5)) }
.cover h1 { font-family: var(--display); font-size: 64px; line-height: .9; margin: 0; font-weight: 700 }
.cover p { margin: 4px 0 0; opacity: .9; font-size: 14px }
.eps { display: grid; gap: 8px; margin-top: 14px }
.ep { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 18px; background: var(--surface); text-align: right; width: 100% }
.ep .num { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface2); font-weight: 800; flex: none; font-variant-numeric: tabular-nums }
.ep.done .num { background: var(--good); color: #062214 }
.ep.playing .num { background: var(--accent); color: var(--accent-ink) }
.ep .t { font-weight: 700; flex: 1; min-width: 0 }
.ep .m { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums }
.nb { margin-top: 22px; border-radius: 22px; padding: 16px; background: var(--surface); display: grid; gap: 12px }
.nb h4 { margin: 0; font-size: 17px }
.nb .steps { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px }
.nb .step { border-radius: 16px; background: var(--surface2); padding: 12px 8px; display: grid; justify-items: center; gap: 6px; text-align: center; font-size: 13px; font-weight: 600 }
.nb .step svg { width: 26px; height: 26px; color: var(--accent) }
.nb .step b { font-size: 11px; color: var(--muted); font-weight: 700 }
.own { display: grid; gap: 8px }
.own .ep .num { background: var(--accent); color: var(--accent-ink) }
.hint { color: var(--muted); font-size: 13px }

/* coach */
.orb-wrap { display: grid; place-items: center; padding-block: 28px 10px }
.orb { width: 190px; height: 190px; border-radius: 50%; position: relative; display: grid; place-items: center }
.orb canvas { position: absolute; inset: -30px; width: 250px; height: 250px }
.orb .core { width: 120px; height: 120px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; position: relative; box-shadow: 0 0 60px color-mix(in srgb, var(--accent) 45%, transparent) }
.orb .core svg { width: 44px; height: 44px }
.orb-status { text-align: center; color: var(--muted); font-size: 14px; min-height: 22px; margin-top: 4px }
.ask { display: flex; gap: 8px; align-items: flex-end; background: var(--surface); border-radius: 22px; padding: 8px }
.ask textarea { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; resize: none; padding: 8px 10px; min-height: 44px; max-height: 140px }
.ask textarea::placeholder { color: var(--muted) }
.send { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none }
.send svg { width: 20px; height: 20px }
.send[disabled] { opacity: .4 }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px }
.chip { padding: 8px 14px; border-radius: 999px; background: var(--surface); font-size: 14px; border: 1px solid var(--line) }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent }
.answer { margin-top: 16px; border-radius: 20px; background: var(--surface); padding: 14px 16px; display: grid; gap: 10px }
.answer .q { font-weight: 700 }
.answer .a { color: var(--muted); font-size: 15px; white-space: pre-wrap }
.answer .a[hidden] { display: none }
.answer .tools { display: flex; gap: 8px; flex-wrap: wrap }
.mini { font-size: 13px; padding: 6px 12px; border-radius: 999px; background: var(--surface2); display: inline-flex; gap: 6px; align-items: center }
.mini svg { width: 15px; height: 15px }

/* profile */
.field { display: grid; gap: 6px; margin-top: 14px }
.field label { font-weight: 700; font-size: 14px }
.field input, .field textarea, .field select { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font: inherit; width: 100% }
.card { background: var(--surface); border-radius: 20px; padding: 16px; margin-top: 14px; display: grid; gap: 10px }
.card h4 { margin: 0 }
.memo li { margin-bottom: 4px }
.range { width: 100% }

/* player */
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px)); pointer-events: none }
.pbar { pointer-events: auto; max-width: 560px; margin: 0 auto; background: color-mix(in srgb, var(--surface2) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 22px; padding: 10px; display: flex; align-items: center; gap: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.35); border: 1px solid var(--line) }
.pbar canvas { width: 48px; height: 48px; border-radius: 14px; flex: none }
.pbar .meta { flex: 1; min-width: 0; text-align: right }
.pbar .meta b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.pbar .meta span { color: var(--muted); font-size: 12px }
.prog { height: 4px; border-radius: 4px; background: var(--line); margin-top: 6px; overflow: hidden }
.prog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s }
.pbtn { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); flex: none }
.pbtn svg { width: 22px; height: 22px }
.pbtn.ghost { background: transparent; color: var(--ink); width: 40px }

.sheet { position: fixed; inset: 0; z-index: 50; background: var(--bg); transform: translateY(102%); transition: transform .35s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 12px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(20px, env(safe-area-inset-left, 0px)) }
.sheet.on { transform: none }
.sheet .stage { flex: 1; display: grid; place-items: center; position: relative; min-height: 0 }
.sheet .stage canvas { width: min(84vw, 380px); height: min(84vw, 380px); border-radius: 36px }
.speakers { display: flex; justify-content: center; gap: 28px; margin-top: 10px }
.spk { display: grid; justify-items: center; gap: 6px; opacity: .45; transition: opacity .3s, transform .3s }
.spk.on { opacity: 1; transform: scale(1.06) }
.spk .av { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 30px; font-weight: 700 }
.spk.on .av { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 60%, transparent) }
.spk small { font-size: 13px; font-weight: 600 }
.sheet .ttl { text-align: center; margin-top: 18px }
.sheet .ttl b { font-family: var(--display); font-size: 40px; display: block; line-height: 1; font-weight: 700 }
.sheet .ttl span { color: var(--muted); font-size: 14px }
.ctrls { display: flex; justify-content: center; align-items: center; gap: 22px; margin-top: 22px }
.ctrls .pbtn { width: 80px; height: 80px }
.ctrls .pbtn svg { width: 34px; height: 34px }
.ctrls .sk { width: 54px; height: 54px; border-radius: 50%; background: var(--surface); display: grid; place-items: center }
.ctrls .sk svg { width: 24px; height: 24px }
.speed { display: flex; justify-content: center; gap: 8px; margin-top: 16px }
.speed button { padding: 6px 12px; border-radius: 999px; background: var(--surface); font-size: 13px; font-variant-numeric: tabular-nums }
.speed button.on { background: var(--ink); color: var(--bg) }
.close { align-self: flex-start }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 112px); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 60; opacity: 0; transition: all .25s; pointer-events: none; max-width: calc(100vw - 32px); text-align: center }
.toast.on { opacity: 1; transform: translateX(-50%) }
.welcome { display: grid; gap: 14px; padding-top: 10px }
.welcome h1 { font-family: var(--display); font-size: 62px; line-height: .9; margin: 10px 0 0; text-wrap: balance }
.welcome p { color: var(--muted); margin: 0 }
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 14px 22px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 17px }
.btn svg { width: 22px; height: 22px }
.btn.sec2 { background: var(--surface); color: var(--ink) }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

<script>// Course content. Two hosts: A = מאיה, B = דניאל. ["P", ms] is a silent pause.
// {name} is replaced with the listener's name from the profile.
// Every claim here is meant to match published research; where research is weak, the episode says so.
window.TOPICS = [
  {
    id: "body-language", title: "שפת גוף", short: "לקרוא אנשים בלי לנחש", hue: 24,
    episodes: [
      { id: "bl1", title: "שלושת הכללים", lines: [
        ["A", "ברוכים הבאים. היום נפרק את המיתוס הכי נפוץ על שפת גוף: שיש תנועה אחת שמסגירה מה אדם חושב."],
        ["B", "כמו ידיים שלובות שאומרות שהוא סגור, או נגיעה באף שאומרת שהוא משקר."],
        ["A", "בדיוק. המחקר לא תומך בזה. ידיים שלובות יכולות להיות קור, נוחות, או סתם הרגל. אין מילון של תנועות."],
        ["B", "אז מה כן עובד?"],
        ["A", "שלושה כללים. הראשון: קו בסיס. לפני שמפרשים משהו, לומדים איך האדם הזה מתנהג כשהוא רגוע. יש אנשים שתמיד זזים, ויש שתמיד יציבים."],
        ["B", "כלומר מה שחשוב זה השינוי, לא ההתנהגות עצמה."],
        ["A", "נכון. הכלל השני: אשכולות. תנועה אחת לא אומרת כלום. שלושה סימנים שמופיעים יחד, למשל גוף שמסתובב ממך, רגליים שמכוונות ליציאה, ותשובות שמתקצרות, זה כבר מידע."],
        ["B", "והשלישי?"],
        ["A", "הקשר. מה קרה רגע לפני? שאלה קשה, חדר קר, עייפות. אותה תנועה במקום אחר אומרת דבר אחר."],
        ["B", "ועוד מיתוס אחד שחייבים לנפץ: שתשעים ושלושה אחוז מהתקשורת הם לא מילוליים."],
        ["A", "זה ציטוט שגוי של מחקרים של אלברט מהרביאן משנות השישים. הם בדקו מצב צר מאוד: מה אנשים מסיקים על רגש כשהמילים והטון סותרים זה את זה. זה לא חל על שיחה רגילה."],
        ["B", "אז המילים חשובות מאוד."],
        ["A", "מאוד. שפת גוף היא שכבה נוספת, לא תחליף. והיא עוזרת בעיקר לשאול שאלה טובה יותר, לא לקפוץ למסקנה."],
        ["B", "התרגיל להיום: בשיחה הבאה שלך, תבחר אדם אחד ותשים לב לקו הבסיס שלו בשתי הדקות הראשונות. איך הוא יושב, כמה הוא זז, מה הקצב שלו. רק לשים לב, בלי לפרש."]
      ]},
      { id: "bl2", title: "איך אתה נראה כשאתה נכנס לחדר", lines: [
        ["A", "היום מדברים עליך. איך אחרים קוראים אותך."],
        ["B", "נתחיל מתנוחת הכוח? שתי דקות בעמידת סופרמן?"],
        ["A", "כאן צריך להיות כנים. מחקר מפורסם מ-2010 טען ששתי דקות בתנוחת כוח משנות הורמונים. ניסויים גדולים יותר אחר כך לא מצאו את השינוי ההורמונלי, וגם לא שינוי בהתנהגות."],
        ["B", "אז זה לא עובד בכלל?"],
        ["A", "נשאר ממצא קטן: חלק מהאנשים מרגישים קצת יותר חזקים. זה הכל. מה שבאמת משפיע על איך שרואים אותך זה דברים פשוטים יותר."],
        ["B", "כמו מה?"],

/* ---------- state + storage ---------- */
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const DEFAULT = { profile: { name: "", about: "", focus: [] }, done: {}, days: {}, memory: [], history: [], settings: { rate: 1, voice: "" }, resume: null };
let S = structuredClone(DEFAULT);
const Store = {
  db: null, uid: null, ref: null, timer: null, busy: false, dirty: false,
  async init() {
    try { const raw = localStorage.getItem("growth.state"); if (raw) S = merge(JSON.parse(raw)); } catch {}
    try {
      if (!window.claude?.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      this.db = db; this.uid = uid;
      this.ref = db.collection("data/users/" + uid).doc("state");
      const snap = await Promise.race([this.ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
      if (snap?.exists) { const remote = snap.data(); if (remote) { S = merge(remote); render(); } }
      else this.save();
    } catch (e) { console.warn("db unavailable", e); }
  },
  save() {
    try { localStorage.setItem("growth.state", JSON.stringify(S)); } catch {}
    if (!this.ref) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 900);
  },
  async flush() {
    if (this.busy) { this.dirty = true; return; }
    this.busy = true;
    try { await this.ref.set(JSON.parse(JSON.stringify(S))); } catch (e) { console.warn("save failed", e); }
    this.busy = false;
    if (this.dirty) { this.dirty = false; this.flush(); }
  }
};
function merge(x) { const o = structuredClone(DEFAULT); for (const k of Object.keys(o)) if (x && x[k] !== undefined) o[k] = (typeof o[k] === "object" && !Array.isArray(o[k]) && o[k]) ? { ...o[k], ...x[k] } : x[k]; return o; }
const nameOf = () => (S.profile.name || "").trim();

/* local audio (NotebookLM files) in IndexedDB, per device */
const Audio$ = {
  dbp: null,
  open() { if (this.dbp) return this.dbp; this.dbp = new Promise((res, rej) => { try { const r = indexedDB.open("growth-audio", 1); r.onupgradeneeded = () => r.result.createObjectStore("files", { keyPath: "id" }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); return this.dbp; },
  async tx(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction("files", mode); const st = t.objectStore("files"); const out = fn(st); t.oncomplete = () => res(out.result ?? out); t.onerror = () => rej(t.error); }); },
  async list(topic) { try { const all = await this.tx("readonly", (st) => st.getAll()); return (all || []).filter((f) => f.topic === topic).sort((a, b) => a.at - b.at); } catch { return []; } },
  async add(topic, file) { return this.tx("readwrite", (st) => st.put({ id: "a" + Date.now(), topic, name: file.name.replace(/\.[^.]+$/, ""), at: Date.now(), blob: file })); },
  async del(id) { return this.tx("readwrite", (st) => st.delete(id)); }
};

/* ---------- speech engine ---------- */
const Voice = {
  claude: null, he: [], ready: false,
  async init() {
    const load = () => { try { this.he = speechSynthesis.getVoices().filter((v) => /^(he|iw)/i.test(v.lang)); } catch { this.he = []; } };
    load();
    try { speechSynthesis.onvoiceschanged = () => { load(); if (view.name === "profile") render(); }; } catch {}
    setTimeout(load, 800);
    try { if (window.claude?.use) this.claude = await claude.use("tts"); } catch {}
  },
  mode() { if (this.he.length || !this.claude) return "device"; return "claude"; },
  pick(who) {
    const pref = S.settings.voice && this.he.find((v) => v.name === S.settings.voice);
    const list = this.he.slice().sort((a, b) => (/(enhanced|premium|neural|online)/i.test(b.name) ? 1 : 0) - (/(enhanced|premium|neural|online)/i.test(a.name) ? 1 : 0));
    if (who === "A") return pref || list[0] || null;
    return list.find((v) => v !== (pref || list[0])) || pref || list[0] || null;
  },
  token: 0,
  speak(text, who = "A") {
    const my = ++this.token;
    text = text.replaceAll("{name}", nameOf() || "חבר");
    if (this.mode() === "claude") {
      return this.claude.speak(text, { voice: who === "A" ? "airy" : "rounded", language: "he", rate: S.settings.rate }).then(() => my === this.token);
    }
    return new Promise((resolve) => {
      try {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "he-IL";
        const v = this.pick(who); if (v) u.voice = v;
        const distinct = this.pick("A") !== this.pick("B");
        u.pitch = who === "B" && !distinct ? 0.78 : 1;
        u.rate = S.settings.rate * (who === "B" && !distinct ? 0.97 : 1);
        let done = false; const fin = (ok) => { if (done) return; done = true; resolve(ok && my === this.token); };
        u.onend = () => fin(true); u.onerror = () => fin(false);
        speechSynthesis.speak(u);
        // Safety net in case a browser never fires onend
        setTimeout(() => fin(true), 4000 + text.length * 140 / S.settings.rate);
      } catch { resolve(false); }
    });
  },
  stop() { this.token++; try { speechSynthesis.cancel(); } catch {} try { this.claude?.stop(); } catch {} }
};

/* ---------- player ---------- */
const P = {
  item: null, idx: 0, playing: false, audio: null, // item: {kind:'ep'|'lines'|'file', title, sub, hue, lines, epId, topic, url}
  load(item, startIdx = 0) { this.stop(true); this.item = item; this.idx = startIdx; showPlayer(); this.play(); },
  async play() {
    if (!this.item) return;
    this.playing = true; paint();
    if (this.item.kind === "file") { try { await this.audio.play(); } catch {} return; }
    const run = ++this.run;
    while (this.playing && run === this.run && this.idx < this.item.lines.length) {
      const [who, val] = this.item.lines[this.idx];
      paint();
      if (who === "P") { await new Promise((r) => setTimeout(r, val / S.settings.rate)); if (run !== this.run) return; this.idx++; continue; }
      let ok;
      try { ok = await Voice.speak(val, who); } catch (e) { ok = false; if (e?.code === "not_granted" || e?.code === "unavailable") { toast("ההקראה כבויה במכשיר הזה"); this.pause(); return; } }
      if (run !== this.run || !this.playing) return;
      if (!ok && this.item) { /* skipped or errored; continue */ }
      this.idx++;
      if (this.item.epId) { S.resume = { epId: this.item.epId, idx: this.idx }; }
    }
    if (run === this.run && this.item && this.idx >= this.item.lines.length) this.finish();
  },
  run: 0,
  pause() { this.playing = false; this.run++; Voice.stop(); if (this.audio) this.audio.pause(); paint(); Store.save(); },
  toggle() { this.playing ? this.pause() : this.play(); },
  skip(d) { if (!this.item) return; if (this.item.kind === "file") { this.audio.currentTime = Math.max(0, this.audio.currentTime + d * 15); return; } const was = this.playing; this.run++; Voice.stop(); this.idx = Math.max(0, Math.min(this.item.lines.length - 1, this.idx + d)); while (this.item.lines[this.idx]?.[0] === "P" && this.idx < this.item.lines.length - 1) this.idx += d > 0 ? 1 : -1; this.idx = Math.max(0, this.idx); if (was) this.play(); else paint(); },
  finish() {
    this.playing = false;
    const it = this.item;
    if (it?.epId) { S.done[it.epId] = Date.now(); S.resume = null; Store.save(); toast("הפרק הושלם"); }
    paint(); if (view.name === "topic" || view.name === "home") render();
    if (it?.onEnd) it.onEnd();
  },
  stop(silent) { this.playing = false; this.run++; Voice.stop(); if (this.audio) { this.audio.pause(); URL.revokeObjectURL(this.audio.src); this.audio = null; } if (!silent) { this.item = null; $("#player").hidden = true; closeSheet(); } }
};
function playEpisode(topicId, epIdx, fromIdx = 0) {
  const t = TOPIC[topicId], ep = t.episodes[epIdx];
  P.load({ kind: "ep", title: ep.title, sub: t.title + " · פרק " + (epIdx + 1), hue: t.hue, lines: ep.lines, epId: ep.id, topic: topicId,
    onEnd: () => { const next = t.episodes[epIdx + 1]; if (next && !S.done[next.id]) setTimeout(() => { if (!P.playing) toastAction("לפרק הבא?", () => playEpisode(topicId, epIdx + 1)); }, 600); } }, fromIdx);
}
function playLines(title, sub, hue, lines) { P.load({ kind: "lines", title, sub, hue, lines }); }
function playFile(rec, topicId) {
  P.stop(true);
  const a = new Audio(URL.createObjectURL(rec.blob)); a.preload = "auto"; a.playbackRate = S.settings.rate;
  a.ontimeupdate = paint; a.onended = () => { P.playing = false; paint(); }; a.onpause = paint;
  P.audio = a; P.item = { kind: "file", title: rec.name, sub: TOPIC[topicId].title + " · NotebookLM", hue: TOPIC[topicId].hue, lines: [] }; P.idx = 0;
  showPlayer(); P.play();
}
function epLength(ep) { const chars = ep.lines.reduce((n, [w, v]) => n + (w === "P" ? v / 70 : v.length), 0); return Math.max(1, Math.round(chars / 760)); }

/* ---------- generative art ---------- */
function art(canvas, hue, seed = 1, motion = 0) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = canvas.clientWidth || 100, h = canvas.clientHeight || 100;
  if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  const c = canvas.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  let s = seed * 9301 + 49297; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const g = c.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, `hsl(${hue} 55% 22%)`); g.addColorStop(1, `hsl(${(hue + 40) % 360} 60% 12%)`);
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  const cx = w * (0.25 + rnd() * 0.5), cy = h * (0.3 + rnd() * 0.3);
  const R = Math.max(w, h);
  for (let i = 18; i > 0; i--) {
    const r = R * (i / 18) * 0.9 + Math.sin(motion * 1.5 + i) * (motion ? 4 : 0);
    c.beginPath();
    for (let a = 0; a <= Math.PI * 2 + 0.01; a += Math.PI / 90) {
      const wob = 1 + 0.06 * Math.sin(a * (3 + (i % 4)) + seed + motion * (0.6 + i * 0.05));
      const x = cx + Math.cos(a) * r * wob, y = cy + Math.sin(a) * r * wob * 0.86;
      a === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
    }
    c.strokeStyle = `hsla(${(hue + i * 4) % 360} 85% ${55 + i * 1.5}% / ${0.10 + (18 - i) * 0.012})`;
    c.lineWidth = 1.2; c.stroke();
  }
  const rg = c.createRadialGradient(cx, cy, 0, cx, cy, R * 0.35);
  rg.addColorStop(0, `hsla(${hue} 95% 70% / .55)`); rg.addColorStop(1, `hsla(${hue} 95% 60% / 0)`);
  c.fillStyle = rg; c.fillRect(0, 0, w, h);
}
function paintArt(root = document) { root.querySelectorAll("canvas[data-hue]").forEach((cv) => art(cv, +cv.dataset.hue, +(cv.dataset.seed || 1))); }

/* ---------- daily tasks ---------- */
function hash(str) { let h = 2166136261; for (const ch of str) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function dayPlan(date = today()) {
  if (!S.days[date]) {
    const focus = S.profile.focus?.length ? S.profile.focus : TOPICS.map((t) => t.id);
    const order = TOPICS.map((t) => t.id).sort((a, b) => hash(date + a) - hash(date + b));
    const inF = order.filter((t) => focus.includes(t)), outF = order.filter((t) => !focus.includes(t));
    // two from the focus topics, one from elsewhere so the week stays broad
    const chosen = [...inF.slice(0, 2), ...(outF.length ? outF.slice(0, 1) : inF.slice(2, 3))];
    while (chosen.length < 3) { const x = order.find((t) => !chosen.includes(t)); if (!x) break; chosen.push(x); }
    const recent = new Set(Object.values(S.days).slice(-6).flatMap((d) => d.items.map((it) => it.i)));
    const picks = chosen.map((tid) => {
      const cand = TASKS.map((x, i) => [x, i]).filter(([x]) => x[0] === tid);
      const fresh = cand.filter(([, i]) => !recent.has(i));
      const list = fresh.length ? fresh : cand;
      const [x, i] = list[hash(date + tid + "t") % list.length];
      return { i, topic: x[0], text: x[1], done: false };
    });
    S.days[date] = { items: picks };
    const keys = Object.keys(S.days).sort(); while (keys.length > 60) delete S.days[keys.shift()];
    Store.save();
  }
  return S.days[date];
}
function streakDays() {
  const out = []; const d = new Date();
  for (let k = 6; k >= 0; k--) { const x = new Date(d); x.setDate(d.getDate() - k); const key = x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); const day = S.days[key]; out.push({ key, on: !!day && day.items.some((i) => i.done), today: k === 0 }); }
  return out;
}

/* ---------- AI coach ---------- */
const Coach = {
  sample: null, tried: false,
  async get() { if (!this.tried) { this.tried = true; try { this.sample = window.claude?.use ? await claude.use("sample") : null; } catch { this.sample = null; } } return this.sample; },
  context() {
    const p = S.profile;
    const listened = Object.keys(S.done).map((id) => { for (const t of TOPICS) { const e = t.episodes.find((x) => x.id === id); if (e) return t.title + ": " + e.title; } return null; }).filter(Boolean);
    const dp = S.days[today()];
    return [
      "שם: " + (p.name || "לא ידוע"),
      "על עצמו: " + (p.about || "לא סיפר עדיין"),
      "נושאי מיקוד: " + ((p.focus || []).map((f) => TOPIC[f]?.title).join(", ") || "הכל"),
      "דברים שלמדת עליו בשיחות קודמות: " + (S.memory.length ? S.memory.join(" | ") : "אין עדיין"),
      "פרקים ששמע: " + (listened.join(", ") || "עוד לא"),
      "משימות היום: " + (dp ? dp.items.map((i) => (i.done ? "[בוצע] " : "") + i.text).join(" | ") : "-"),
      "שאלות אחרונות: " + (S.history.slice(-4).map((h) => h.q).join(" | ") || "-"),
    ].join("\n");
  },
  rules: `אתה "המאמן" באפליקציית התפתחות אישית בעברית. המשתמש לא קורא, הוא שומע: כל מה שתכתוב יוקרא בקול.
כללים:
- עברית מדוברת, חמה וישירה, בלשון זכר, פונה אליו בשמו לפעמים.
- רק מידע אמיתי ומבוסס. אם המחקר חלש או שנוי במחלוקת, אמור זאת במשפט אחד. אל תמציא מחקרים, מספרים או ציטוטים.
- במיקרו-הבעות ושפת גוף: לעולם לא להבטיח זיהוי שקרים.
- בכסף: ידע כללי לישראל, לא המלצה על מוצר ספציפי. בהחלטות גדולות, הפנה ליועץ בלתי תלוי. ברפואה ובנפש: הפנה לאיש מקצוע כשיש סימן לבעיה אמיתית.
- מבנה: תשובה ברורה בשני משפטים, ואז למה זה עובד, ואז צעד אחד לעשות היום.
- בלי כוכביות, בלי רשימות ממוספרות, בלי כותרות ובלי אימוג'י. משפטים קצרים שנעים לשמוע.
- עד 170 מילים.`,
  async ask(q) {
    const sample = await this.get();
    if (!sample) throw Object.assign(new Error("no sample"), { code: "unavailable" });
    const prompt = `${this.rules}

מה שידוע לך על המשתמש:
${this.context()}

השאלה שלו: ${q}

החזר JSON בלבד בצורה:
{"answer": "התשובה המדוברת", "task": "משימה אחת קצרה להיום שנובעת מהתשובה, עד 14 מילים", "remember": ["עובדה חדשה וחשובה שלמדת עליו מהשאלה, אם יש. אחרת מערך ריק"]}`;
    const r = await sample.json(prompt, { cache: false, modelTier: "default" });
    if (!r || typeof r.answer !== "string") throw Object.assign(new Error("bad"), { code: "invalid_json" });
    return r;
  },
  async personalTask() {
    const sample = await this.get();
    if (!sample) throw Object.assign(new Error("no sample"), { code: "unavailable" });
    const prompt = `${this.rules}

מה שידוע לך על המשתמש:
${this.context()}

צור משימה אישית אחת להיום, שמתאימה לו ושונה ממשימות היום. משהו מעשי שלוקח עד עשרים דקות, מבוסס, לא קלישאה.
החזר JSON בלבד: {"topic": "אחד מ: ${TOPICS.map((t) => t.id).join(", ")}", "task": "המשימה, עד 16 מילים", "why": "משפט אחד למה זה עובד"}`;
    return sample.json(prompt, { cache: false, modelTier: "default" });
  }
};
function sentences(text) { return text.replace(/\s+/g, " ").match(/[^.!?]+[.!?]*/g)?.map((s) => s.trim()).filter(Boolean) || [text]; }

  mount(cv) { this.cv = cv; cancelAnimationFrame(this.raf); const loop = () => { if (!this.cv) return; this.t += this.playing ? 0.03 : 0.004; art(this.cv, +this.cv.dataset.hue, 5, this.t); this.raf = requestAnimationFrame(loop); }; loop(); },

    const loop = () => { if (!document.body.contains(cv)) return; this.t += this.active ? 0.05 : 0.012; const dpr = Math.min(2, devicePixelRatio || 1); cv.width = 250 * dpr; cv.height = 250 * dpr; const c = cv.getContext("2d"); c.scale(dpr, dpr);

  const f = root.querySelector("#askf"); if (f) { f.onsubmit = (e) => { e.preventDefault(); askNow(); }; const ta = $("#askq"); ta.oninput = () => { ta.style.height = "auto"; ta.style.height = Math.min(140, ta.scrollHeight) + "px"; }; ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); askNow(); } }; }
  const rate = root.querySelector("#p-rate"); if (rate) rate.oninput = () => { S.settings.rate = +rate.value; $("#rateV").textContent = rate.value; Store.save(); };
  const vs = root.querySelector("#p-voice"); if (vs) vs.onchange = () => { S.settings.voice = vs.value; Store.save(); };
}
function act(a, b) {
  const dp = S.days[today()];
  switch (a) {
    case "drawer": openDrawer(); break;
    case "start": {
      const n = $("#w-name").value.trim();
      S.profile.name = n; S.profile.focus = [...welcomeFocus]; if (!n) S.profile.skipped = true;
      delete S.days[today()]; Store.save(); go("home");
      playLines("ברוכים הבאים", "היכרות", 38, [
        ["A", `${n ? "היי " + n + ", " : "היי, "}אני מאיה.`], ["B", "ואני דניאל. אנחנו נלווה אותך כאן."],
        ["A", "כל נושא בנוי מפרקים קצרים של כמה דקות. אתה לא צריך לקרוא כלום, רק לשמוע."],
        ["B", "בכל יום מחכות לך שלוש משימות קטנות. הן נבחרות לפי מה שבחרת להתמקד בו."],
        ["A", "ויש גם מאמן. לוחצים על הכוכב למעלה, שואלים כל שאלה, והוא עונה בקול, לפי מה שהוא יודע עליך."],
        ["B", "הכל כאן מבוסס על מחקר. וכשהמחקר לא חד, נגיד לך את זה. בוא נתחיל."]
      ]);
      break;
    }
    case "brief": {
      const d = dayPlan(); const n = nameOf();
      const lines = [["A", `${n ? n + ", " : ""}הנה היום שלך.`], ["B", `יש לך ${d.items.filter((i) => !i.done).length || "אפס"} משימות פתוחות.`]];
      d.items.forEach((it, k) => { if (!it.done) lines.push([k % 2 ? "B" : "A", it.text]); });
      const nx = nextEpisode();
      if (nx) { const ep = TOPIC[nx.t].episodes[nx.e]; lines.push(["A", `ומיד אחרי זה, הפרק הבא שלך: ${ep.title}, בנושא ${TOPIC[nx.t].title}.`]); }
      P.load({ kind: "lines", title: "היום שלך", sub: new Date().toLocaleDateString("he-IL", { weekday: "long" }), hue: 38, lines, onEnd: nx ? () => playEpisode(nx.t, nx.e, nx.from) : null });
      break;
    }
    case "say-tasks": { const d = dayPlan(); playLines("המשימות של היום", "היום שלך", 38, d.items.map((it, k) => [k % 2 ? "B" : "A", `משימה ${k + 1}. ${it.text}`])); break; }
    case "say-task": { const it = dp.items[+b.dataset.k]; playLines("משימה", TOPIC[it.topic]?.title || "", TOPIC[it.topic]?.hue || 38, [["A", it.text], ...(it.why ? [["B", it.why]] : [])]); break; }
    case "check": { const it = dp.items[+b.dataset.k]; it.done = !it.done; Store.save(); if (it.done) { toast(dp.items.every((i) => i.done) ? "כל המשימות של היום בוצעו. כל הכבוד." : "בוצע"); } render(); break; }
    case "ai-task": {
      b.disabled = true; b.innerHTML = I.spark + " חושב...";
      Coach.personalTask().then((r) => {
        if (!r?.task) throw new Error("empty");
        const topic = TOPIC[r.topic] ? r.topic : "confidence";
        dayPlan().items.push({ i: -1, topic, text: r.task, why: r.why || "", done: false, ai: true }); Store.save(); render();
        playLines("משימה אישית", "מהמאמן", TOPIC[topic].hue, [["A", r.task], ...(r.why ? [["B", r.why]] : [])]);
      }).catch((e) => { toast(coachErr(e)); render(); });
      break;
    }
    case "toggle": P.toggle(); break;
    case "skip": P.skip(+b.dataset.d); break;
    case "sheet": openSheet(); break;
    case "close-sheet": closeSheet(); break;
    case "close-player": P.stop(); break;
    case "orb": if (Orb.active) { speakGen++; Voice.stop(); Orb.set("עצרתי.", false); } else { const h = S.history.slice(-1)[0]; if (h) speakAnswer(h); else $("#askq")?.focus(); } break;
    case "replay-last": { const h = S.history.slice(-1)[0]; if (h) speakAnswer(h); break; }
    case "show-text": { const t = $("#ansText"); t.hidden = !t.hidden; break; }
    case "add-task": { const h = S.history.slice(-1)[0]; if (h?.task) { dayPlan().items.push({ i: -1, topic: guessTopic(h.q), text: h.task, done: false, ai: true }); h.task = ""; Store.save(); toast("נוסף למשימות של היום"); render(); } break; }
    case "save-profile": S.profile.name = $("#p-name").value.trim(); S.profile.about = $("#p-about").value.trim(); delete S.profile.skipped; Store.save(); toast("נשמר"); render(); break;
    case "test-voice": playLines("בדיקת קול", "הגדרות", 38, [["A", `שלום${nameOf() ? " " + nameOf() : ""}, ככה אני נשמעת.`], ["B", "וככה אני נשמע."]]); break;
    case "forget": S.memory.splice(+b.dataset.i, 1); Store.save(); render(); break;
    case "nb-copy": copySource(b.dataset.arg); break;
    case "nb-up": $("#audioIn").dataset.topic = b.dataset.arg; $("#audioIn").click(); break;
    case "nb-how": playLines("איך יוצרים פודקאסט עומק", "NotebookLM", 220, [
      ["A", "NotebookLM של גוגל יודע להפוך חומר לפודקאסט של שני מגישים. זה חינמי, ועושים את זה כך."],
      ["B", "צעד ראשון: לוחצים על העתק חומר. זה מעתיק את כל החומר של הנושא, יחד עם הוראות."],
      ["A", "צעד שני: לוחצים על צור סקירת אודיו. זה פותח את NotebookLM. יוצרים מחברת חדשה, מוסיפים מקור מסוג טקסט שהועתק, ומדביקים."],
      ["B", "אחר כך בוחרים סקירת אודיו. בהגדרות אפשר לבחור שפה, כדאי לבחור עברית. ולחכות כמה דקות."],
      ["A", "צעד שלישי: מורידים את קובץ האודיו, חוזרים לכאן, ולוחצים על הוסף לכאן. הפודקאסט יישמר בנושא הזה במכשיר שלך."]
    ]); break;
  }
}
function guessTopic(q) { const m = [["body-language", /גוף|תנוע|ידיים|עמיד/], ["faces", /פנים|הבע|חיוך/], ["saving", /חיסכ|לחסוך|חוב|מינוס|פנסי/], ["earning", /הכנס|משכורת|העלא|עסק|לקוח/], ["relationship", /זוג|אישה|חברה|בת ה|אהב/], ["body", /שינה|כושר|אימון|אוכל|תזונ|גוף שלי/], ["presence", /נוכח|לחץ|נשימ|קשב/]]; for (const [id, re] of m) if (re.test(q)) return id; return "confidence"; }
function coachErr(e) {
  const c = e?.code;
  if (c === "unavailable" || c === "not_granted") return "המאמן זמין כשפותחים את האפליקציה בתוך Claude, מחוברים לחשבון.";
  if (c === "rate_limited") return "יותר מדי שאלות ברגע. נסה שוב בעוד דקה.";
  return "לא הצלחתי לקבל תשובה. נסה שוב.";
}
async function askNow() {
  const ta = $("#askq"); const q = ta.value.trim(); if (!q) { ta.focus(); return; }
  const btn = $("#asks"); btn.disabled = true;
  P.pause(); Voice.stop();
  Orb.set("חושב על זה...", true);
  try {
    const r = await Coach.ask(q);
    const h = { q, a: r.answer.trim(), task: (r.task || "").trim(), at: Date.now() };
    S.history.push(h); if (S.history.length > 40) S.history.splice(0, S.history.length - 40);
    for (const m of (Array.isArray(r.remember) ? r.remember : [])) if (typeof m === "string" && m.trim() && !S.memory.includes(m.trim())) S.memory.push(m.trim());
    if (S.memory.length > 30) S.memory.splice(0, S.memory.length - 30);
    Store.save(); ta.value = "";
    render(); speakAnswer(h);
  } catch (e) { Orb.set(coachErr(e), false); }
  finally { const b2 = $("#asks"); if (b2) b2.disabled = false; }
}
let speakGen = 0;
async function speakAnswer(h) {
  P.pause(); Voice.stop();
  const parts = sentences(h.a); const my = ++speakGen;
  Orb.set("מדבר...", true);
  let all = true;
  for (const s of parts) {
    let ok; try { ok = await Voice.speak(s, "A"); } catch { ok = false; }
    if (!ok || my !== speakGen) { all = false; break; }
  }
  if (my === speakGen) Orb.set(all ? (h.task ? "המשימה שלך: " + h.task : "שאל עוד שאלה.") : "עצרתי. לחץ על העיגול כדי לשמוע שוב.", false);
}
async function copySource(id) {
  const t = TOPIC[id];
  const body = t.episodes.map((e, i) => `פרק ${i + 1}: ${e.title}\n` + e.lines.filter(([w]) => w !== "P").map(([, v]) => v.replaceAll("{name}", nameOf() || "המאזין")).join("\n")).join("\n\n");
  const about = S.profile.about ? `\n\nעל המאזין: ${S.profile.about}` : "";
  const text = `נושא: ${t.title}\n\nהוראות לסקירת האודיו: צרו פודקאסט בעברית, בשיחה בין שני מגישים, שמעמיק בנושא ${t.title}. הסבירו רק מה שמבוסס במחקר, אמרו במפורש איפה המחקר חלש או שנוי במחלוקת, תנו דוגמאות מהחיים בישראל, וסיימו בתרגיל מעשי אחד להיום.${about}\n\nחומר:\n\n${body}`;
  try { await navigator.clipboard.writeText(text); toast("הועתק. עכשיו פתח את NotebookLM והדבק כמקור."); }
  catch { const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;top:0;left:0;width:100%;height:40vh;z-index:99"; document.body.appendChild(ta); ta.select(); toast("סמן הכל והעתק"); setTimeout(() => ta.remove(), 15000); }
}
$("#audioIn").onchange = async (e) => {
  const f = e.target.files?.[0]; const topic = e.target.dataset.topic; e.target.value = "";
  if (!f || !topic) return;
  try { await Audio$.add(topic, f); toast("הפודקאסט נשמר בנושא " + TOPIC[topic].title); if (view.name === "topic") loadOwnAudio(topic); }
  catch { toast("לא הצלחתי לשמור את הקובץ במכשיר הזה."); }
};
$("#scrim").onclick = closeDrawer;
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#drawer").classList.contains("on")) { e.preventDefault(); closeDrawer(); } });
document.addEventListener("visibilitychange", () => { if (document.hidden) Store.save(); });
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => paintArt(), 150); });

/* boot */
async function waitClaude(ms = 2000) { const t0 = Date.now(); while (!window.claude?.use && Date.now() - t0 < ms) await new Promise((r) => setTimeout(r, 100)); }
(async function boot() {
  try { const v = JSON.parse(localStorage.getItem("growth.view") || "null"); if (v?.name && (v.name !== "topic" || TOPIC[v.arg])) view = v; } catch {}

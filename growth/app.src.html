<title>צמיחה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Heebo:wght@400;500;600;700&display=swap">
<style>
/* Layout: an immersive night-sky app. A slow aurora behind everything takes the hue of what you are doing;
   glass cards float over it. Deliberately one dark visual world (no light variant). */
:root {
  --hue: 265;
  --bg: #07080f; --ink: #f4f2ff; --muted: rgba(244,242,255,.62); --faint: rgba(244,242,255,.38);
  --glass: rgba(255,255,255,.055); --glass2: rgba(255,255,255,.09); --stroke: rgba(255,255,255,.09);
  --gold: #ffc861; --gold-ink: #2a1800; --mint: #6ff0b4; --rose: #ff7a90;
  --display: "Rubik", "Heebo", "Arial Hebrew", system-ui, sans-serif;
  --body: "Heebo", "Arial Hebrew", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { background: var(--bg); color: var(--ink) }
body { font-family: var(--body); font-size: 16px; line-height: 1.5; min-height: 100%; overflow-x: hidden }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg) }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: inherit }
button, .press { transition: transform .15s ease, background .2s, opacity .2s }
button:active, .press:active { transform: scale(.96) }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px }
input, textarea, select { font: inherit; color: var(--ink) }

.sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none }
.sky i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(70px); opacity: .55; transition: background 1.2s }
.sky i:nth-child(1) { background: radial-gradient(circle, hsl(var(--hue) 90% 55% / .55), transparent 65%); top: -30vmax; right: -20vmax; animation: drift1 26s ease-in-out infinite alternate }
.sky i:nth-child(2) { background: radial-gradient(circle, hsl(calc(var(--hue) + 60) 90% 50% / .4), transparent 65%); bottom: -35vmax; left: -25vmax; animation: drift2 32s ease-in-out infinite alternate }
.sky i:nth-child(3) { background: radial-gradient(circle, hsl(calc(var(--hue) - 50) 90% 60% / .28), transparent 60%); top: 30%; left: 20%; width: 50vmax; height: 50vmax; animation: drift1 40s ease-in-out infinite alternate-reverse }
.sky::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.5) 1px, transparent 1.4px); background-size: 120px 120px; opacity: .08 }
@keyframes drift1 { to { transform: translate(-12vmax, 10vmax) scale(1.15) } }
@keyframes drift2 { to { transform: translate(14vmax, -8vmax) scale(.9) } }

#app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 150px }
.view { animation: rise .45s cubic-bezier(.2,.8,.2,1) both }
@keyframes rise { from { opacity: 0; transform: translateY(14px) } }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; padding-block: 12px; margin-inline: -4px }
.top::before { content: ""; position: absolute; inset: 0 -20px; background: linear-gradient(var(--bg) 40%, transparent); z-index: -1 }
.brand { font-family: var(--display); font-weight: 900; font-size: 26px; letter-spacing: -.5px; display: flex; align-items: center; gap: 8px }
.brand .seed { width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(from 200deg, var(--gold), hsl(var(--hue) 90% 65%), var(--gold)); box-shadow: 0 0 18px hsl(var(--hue) 90% 60% / .7) }
.glassbtn { width: 46px; height: 46px; border-radius: 16px; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--stroke); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px) }
.glassbtn svg { width: 22px; height: 22px }
.burger span { display: block; width: 20px; height: 2.2px; background: var(--ink); border-radius: 2px; margin: 4.5px 0 }
.burger span:nth-child(2) { width: 14px; margin-inline-start: auto }
.lvl { position: relative; width: 46px; height: 46px }
.lvl svg { width: 46px; height: 46px }
.lvl b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 16px }

.scrim { position: fixed; inset: 0; background: rgba(3,3,10,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .3s }
.scrim.on { opacity: 1; pointer-events: auto }
.drawer { position: fixed; top: 0; bottom: 0; right: 0; width: min(88vw, 390px); z-index: 41; transform: translateX(105%); transition: transform .4s cubic-bezier(.2,.9,.2,1); padding: calc(env(safe-area-inset-top, 0px) + 20px) max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; background: rgba(14,14,28,.86); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-left: 1px solid var(--stroke) }
.drawer.on { transform: none }
.drawer h2 { font-family: var(--display); font-weight: 900; font-size: 30px; margin: 0 0 10px }
.dlabel { color: var(--faint); font-size: 12px; font-weight: 700; letter-spacing: .08em; margin: 14px 4px 4px }
.navitem { display: flex; align-items: center; gap: 14px; padding: 9px 8px; border-radius: 18px; width: 100% }
.navitem.cur, .navitem:hover { background: var(--glass2) }
.orbmini { width: 46px; height: 46px; border-radius: 15px; flex: none; position: relative; overflow: hidden }
.navitem .t { font-weight: 700; font-size: 16px; display: block }
.navitem .s { color: var(--muted); font-size: 12.5px }
.navitem .ring { margin-inline-start: auto; flex: none }
.navicon { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; background: var(--glass2); flex: none }
.navicon svg { width: 22px; height: 22px }

.orb { position: absolute; inset: 0; background:
  radial-gradient(circle at 70% 25%, hsl(calc(var(--h) + 30) 100% 75% / .9), transparent 38%),
  radial-gradient(circle at 25% 80%, hsl(calc(var(--h) - 40) 95% 55% / .9), transparent 48%),
  radial-gradient(circle at 50% 50%, hsl(var(--h) 85% 45%), hsl(calc(var(--h) + 20) 80% 18%) 80%) }
.orb::after { content: ""; position: absolute; inset: 0; background: repeating-radial-gradient(circle at 70% 25%, rgba(255,255,255,.08) 0 1px, transparent 1px 14px); mix-blend-mode: overlay }

.card { background: var(--glass); border: 1px solid var(--stroke); border-radius: 26px; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px) }

.hero { position: relative; border-radius: 32px; overflow: hidden; margin-top: 4px; padding: 22px; min-height: 260px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; isolation: isolate }
.hero .orb { z-index: -1; animation: breathe 9s ease-in-out infinite }
@keyframes breathe { 50% { transform: scale(1.08) rotate(3deg) } }
.hero .date { font-size: 13px; opacity: .85; font-weight: 600 }
.hero h1 { font-family: var(--display); font-weight: 900; font-size: 40px; line-height: 1; margin: 6px 0 0; text-wrap: balance; letter-spacing: -.5px }
.stats { display: flex; gap: 8px; flex-wrap: wrap }
.stat { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: rgba(0,0,0,.28); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums }
.stat svg { width: 16px; height: 16px }
.go { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px }
.go small { display: block; opacity: .85; font-size: 13px }
.go b { font-family: var(--display); font-size: 20px; font-weight: 800; line-height: 1.15 }
.play { width: 74px; height: 74px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); display: grid; place-items: center; flex: none; box-shadow: 0 0 0 8px rgba(255,200,97,.18), 0 14px 40px rgba(0,0,0,.45); position: relative }
.play::before { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid rgba(255,200,97,.5); animation: ping 2.4s ease-out infinite }
@keyframes ping { to { transform: scale(1.35); opacity: 0 } }
.play svg { width: 30px; height: 30px }

.sec { margin-top: 28px }
.sechead { display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px 12px }
.sechead h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -.3px }
.sechead .aux { color: var(--muted); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums }

.tasks { display: grid; gap: 10px }
.task { position: relative; display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 22px; overflow: hidden }
.task::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 40%, hsl(var(--h) 90% 60% / .16)); pointer-events: none }
.task .txt { flex: 1; min-width: 0; font-size: 15px; line-height: 1.4; font-weight: 500 }
.task .tag { display: block; font-size: 11.5px; color: hsl(var(--h) 90% 75%); font-weight: 700; margin-bottom: 2px }
.task.done .txt { opacity: .5 }
.task.done .txt span:last-child { text-decoration: line-through }
.round { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--glass2); flex: none; position: relative }
.round svg { width: 18px; height: 18px }
.round.check.on { background: var(--mint); color: #04261a; animation: pop .4s }
@keyframes pop { 40% { transform: scale(1.25) } }
.row { display: flex; gap: 8px; flex-wrap: wrap }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: var(--glass); border: 1px solid var(--stroke); font-weight: 600; font-size: 14px }
.pill svg { width: 17px; height: 17px }
.pill.gold { background: var(--gold); color: var(--gold-ink); border-color: transparent }

.week { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 6px; padding: 14px }
.day { display: grid; justify-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); font-weight: 600 }
.day i { width: 100%; max-width: 38px; aspect-ratio: 1; border-radius: 12px; background: var(--glass2); display: grid; place-items: center }
.day.on i { background: linear-gradient(135deg, var(--gold), #ff8a5c); box-shadow: 0 0 16px rgba(255,170,90,.45) }
.day.on i svg { width: 16px; height: 16px; color: var(--gold-ink) }
.day.today { color: var(--ink) }
.day.today i { outline: 1.5px solid rgba(255,255,255,.5); outline-offset: 2px }

.rail { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 4px 10px; margin-inline: -4px; scrollbar-width: none }
.rail::-webkit-scrollbar { display: none }
.lab { scroll-snap-align: start; flex: 0 0 62%; max-width: 250px; aspect-ratio: 1 / 1.12; border-radius: 28px; position: relative; overflow: hidden; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end; isolation: isolate }
.lab .orb { z-index: -1 }
.lab .ico { position: absolute; top: 16px; right: 16px; width: 48px; height: 48px; border-radius: 16px; background: rgba(0,0,0,.25); display: grid; place-items: center; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px) }
.lab .ico svg { width: 26px; height: 26px }
.lab b { font-family: var(--display); font-weight: 900; font-size: 26px; line-height: 1 }
.lab span.s { font-size: 13px; opacity: .9; margin-top: 4px }
.shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(transparent 32%, rgba(0,0,0,.55)) }

.topics { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px }
.topic { position: relative; border-radius: 26px; overflow: hidden; aspect-ratio: 1 / 1.08; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; isolation: isolate }
.topic .orb { z-index: -1 }
.topic b { font-family: var(--display); font-weight: 900; font-size: 22px; line-height: 1.05; display: block }
.topic small { display: block; opacity: .8; font-size: 12px; margin-top: 2px }

.resume { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 24px; width: 100% }
.resume .art { width: 62px; height: 62px; border-radius: 18px; overflow: hidden; position: relative; flex: none }
.resume .t { flex: 1; min-width: 0 }
.resume .t b { display: block; font-weight: 700 }
.resume .t small { color: var(--muted) }
.resume .round { background: var(--gold); color: var(--gold-ink); width: 48px; height: 48px }

.cover { position: relative; border-radius: 34px; overflow: hidden; padding: 22px; min-height: 300px; display: flex; flex-direction: column; justify-content: flex-end; isolation: isolate; margin-top: 4px }
.cover .orb { z-index: -2; animation: breathe 11s ease-in-out infinite }
.cover h1 { font-family: var(--display); font-weight: 900; font-size: 54px; line-height: .95; margin: 0; letter-spacing: -1px }
.cover p { margin: 6px 0 0; opacity: .88; font-weight: 500 }
.eps { display: grid; gap: 10px; margin-top: 16px }
.ep { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 22px; width: 100% }
.ep .n { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--glass2); font-family: var(--display); font-weight: 800; flex: none; font-variant-numeric: tabular-nums }
.ep .n svg { width: 20px; height: 20px }
.ep.done .n { background: var(--mint); color: #04261a }
.ep.now .n { background: var(--gold); color: var(--gold-ink) }
.ep .t { flex: 1; min-width: 0; font-weight: 700 }
.ep .t small { display: block; color: var(--muted); font-weight: 500; font-size: 13px }
.badge { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: rgba(255,200,97,.16); color: var(--gold); flex: none }
.badge.ok { background: rgba(111,240,180,.14); color: var(--mint) }
.nb { margin-top: 22px; padding: 18px; display: grid; gap: 12px }
.nb h4 { margin: 0; font-family: var(--display); font-size: 19px; font-weight: 800 }
.nb p { margin: 0; color: var(--muted); font-size: 14px }
.nbgo { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 20px; background: linear-gradient(135deg, hsl(var(--h) 80% 55% / .35), rgba(255,255,255,.04)); border: 1px solid var(--stroke); width: 100% }
.nbgo svg { width: 24px; height: 24px; flex: none }
.nbgo b { display: block }
.nbgo small { color: var(--muted) }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; border-radius: 18px; margin-top: 6px }
.seg button { padding: 10px; border-radius: 14px; font-weight: 700; text-align: center }
.seg button.on { background: var(--ink); color: var(--bg) }
.voiceorb { display: grid; place-items: center; padding-block: 26px 6px }
.vo { width: 180px; height: 180px; position: relative; display: grid; place-items: center; border-radius: 50% }
.vo canvas { position: absolute; inset: -40px; width: 260px; height: 260px }
.vo .core { width: 112px; height: 112px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6dc, var(--gold) 45%, #ff8a5c); color: var(--gold-ink); display: grid; place-items: center; box-shadow: 0 0 70px rgba(255,180,90,.55); position: relative }
.vo .core svg { width: 42px; height: 42px }
.status { text-align: center; color: var(--muted); font-size: 14.5px; min-height: 22px; margin-top: 6px; padding-inline: 10px }
.ask { display: flex; gap: 8px; align-items: flex-end; padding: 8px; border-radius: 24px; margin-top: 14px }
.ask textarea { flex: 1; min-width: 0; border: 0; background: transparent; resize: none; padding: 9px 10px; min-height: 44px; max-height: 140px; font-size: 16px }
.ask textarea::placeholder { color: var(--faint) }
.send { width: 46px; height: 46px; border-radius: 50%; background: var(--gold); color: var(--gold-ink); display: grid; place-items: center; flex: none }
.send svg { width: 20px; height: 20px }
.send[disabled] { opacity: .4 }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px }
.chip { padding: 9px 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--stroke); font-size: 14px; font-weight: 500 }
.chip.on { background: var(--gold); color: var(--gold-ink); border-color: transparent; font-weight: 700 }
.answer { margin-top: 16px; padding: 16px; display: grid; gap: 10px }
.answer .q { font-weight: 700 }
.answer .a { color: var(--muted); font-size: 15px; white-space: pre-wrap }
.tools { display: flex; gap: 8px; flex-wrap: wrap }
.mini { font-size: 13px; padding: 7px 12px; border-radius: 999px; background: var(--glass2); display: inline-flex; gap: 6px; align-items: center; font-weight: 600 }
.mini svg { width: 15px; height: 15px }
.rp { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-top: 14px }
.rpc { position: relative; overflow: hidden; border-radius: 22px; padding: 14px; min-height: 110px; display: flex; flex-direction: column; justify-content: flex-end; isolation: isolate }
.rpc .orb { z-index: -1; opacity: .85 }
.rpc b { font-family: var(--display); font-weight: 800; font-size: 17px; line-height: 1.15 }
.turns { display: grid; gap: 8px; margin-top: 14px }
.turn { display: flex; gap: 10px; align-items: center }
.turn .who { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none }
.turn.ai .who { background: var(--gold); color: var(--gold-ink) }
.turn.me .who { background: var(--glass2) }
.turn .bub { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 16px; background: var(--glass); font-size: 14.5px; color: var(--muted) }
.turn .bub[data-hidden] { color: transparent; text-shadow: 0 0 9px rgba(244,242,255,.55); user-select: none }
.fb { padding: 16px; margin-top: 14px; display: grid; gap: 8px }
.score { font-family: var(--display); font-weight: 900; font-size: 54px; line-height: 1; color: var(--gold) }

.facebox { position: relative; border-radius: 32px; overflow: hidden; margin-top: 6px; aspect-ratio: 1 / 1.02; max-width: 100%; display: grid; place-items: center; isolation: isolate }
.facebox .orb { z-index: -1; opacity: .7 }
#face { width: 74%; display: grid; place-items: center }
#face svg { width: 100%; height: auto }
.facehud { position: absolute; top: 14px; inset-inline: 14px; display: flex; justify-content: space-between; gap: 8px }
.countdown { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 96px; color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.4); pointer-events: none }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin-top: 14px }
.opt { padding: 14px; border-radius: 18px; font-weight: 700; text-align: center; font-size: 16px }
.opt.right { background: var(--mint); color: #04261a }
.opt.wrong { background: var(--rose); color: #2a0008 }
.opt[disabled] { opacity: .55 }
.opt.right[disabled], .opt.wrong[disabled] { opacity: 1 }
.levels { display: flex; gap: 6px; margin-top: 12px }
.levels button { flex: 1; padding: 8px 4px; border-radius: 14px; background: var(--glass); border: 1px solid var(--stroke); font-size: 13px; font-weight: 700; text-align: center; line-height: 1.25 }
.levels button small { font-weight: 500; opacity: .7 }
.levels button.on { background: var(--ink); color: var(--bg) }
.levels button[disabled] { opacity: .35 }
.explain { padding: 14px 16px; margin-top: 12px; font-size: 14.5px; color: var(--muted) }
.explain b { color: var(--ink) }

.big { font-family: var(--display); font-weight: 900; font-size: 44px; line-height: 1; letter-spacing: -1px; font-variant-numeric: tabular-nums; margin-top: 4px }
.ctrl { display: grid; gap: 4px }
.ctrl label { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px }
.ctrl label span { color: var(--gold); font-variant-numeric: tabular-nums }
input[type=range] { width: 100%; accent-color: var(--gold) }
.bars { display: flex; height: 18px; border-radius: 10px; overflow: hidden; background: var(--glass2) }
.bars i { display: block; height: 100%; transition: width .5s }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted) }
.legend b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px }
.loss { padding: 14px; border-radius: 18px; background: rgba(255,122,144,.12); border: 1px solid rgba(255,122,144,.3) }

.breath { display: grid; place-items: center; padding-block: 30px 10px }
.bo { width: 240px; height: 240px; border-radius: 50%; position: relative; display: grid; place-items: center }
.bo .ball { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #e8fbff, hsl(190 90% 60%) 45%, hsl(250 80% 50%)); box-shadow: 0 0 80px hsl(200 90% 60% / .55); transform: scale(.7) }
.bo .ringb { position: absolute; inset: 0; border-radius: 50%; border: 1.5px dashed rgba(255,255,255,.25) }
.phase { font-family: var(--display); font-weight: 800; font-size: 26px; text-align: center; margin-top: 18px; min-height: 36px }
.tmr { text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 24px }

.field { display: grid; gap: 6px; margin-top: 14px }
.field label { font-weight: 700; font-size: 14px }
.field input, .field textarea, .field select { background: var(--glass); border: 1px solid var(--stroke); border-radius: 16px; padding: 12px 14px; width: 100% }
.hint { color: var(--muted); font-size: 13px; margin: 0 }
.panel { padding: 16px; margin-top: 14px; display: grid; gap: 14px }
.panel h4 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 18px }
.memo { margin: 0; padding-inline-start: 18px }
.memo li { margin-bottom: 6px }
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 15px 24px; border-radius: 999px; background: var(--gold); color: var(--gold-ink); font-weight: 800; font-size: 17px; font-family: var(--display) }

/* ---------- state + storage ---------- */
const dkey = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => dkey();
const DEFAULT = { profile: { name: "", say: "", about: "", focus: [] }, done: {}, quiz: {}, days: {}, memory: [], history: [], xp: 0, face: { best: 0, level: 0, total: 0, right: 0 }, labs: {}, settings: { rate: 1, voice: "", engine: "auto", captions: false }, resume: null };
let S = structuredClone(DEFAULT);
function merge(x) { const o = structuredClone(DEFAULT); for (const k of Object.keys(o)) if (x && x[k] !== undefined) o[k] = (typeof o[k] === "object" && !Array.isArray(o[k]) && o[k]) ? { ...o[k], ...x[k] } : x[k]; return o; }
const Store = {
  ref: null, timer: null, busy: false, dirty: false,
  async init() {
    try { const raw = localStorage.getItem("growth.state"); if (raw) S = merge(JSON.parse(raw)); } catch {}
    try {
      if (!window.claude?.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;

      this.ref = db.collection("data/users/" + uid).doc("state");

  },
  save() {
    try { localStorage.setItem("growth.state", JSON.stringify(S)); } catch {}
    if (!this.ref) return;
    clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 900);
  },
  async flush() {
    if (this.busy) { this.dirty = true; return; }

    try { await this.ref.set(JSON.parse(JSON.stringify(S))); } catch (e) { console.warn("save failed", e); }

    if (this.dirty) { this.dirty = false; this.flush(); }
  }
};
const nameOf = () => (S.profile.name || "").trim();

/* ---------- XP + levels ---------- */
const LEVELS = [[0, "ניצוץ"], [80, "סקרן"], [200, "לומד"], [380, "מתאמן"], [620, "יציב"], [920, "נוכח"], [1300, "חד"], [1800, "מוביל"], [2500, "מנטור"], [3400, "מאסטר"]];

  const before = levelOf().n; S.xp += n; Store.save();
  toast(`+${n} נקודות · ${why}`); Sound.chime();
  const after = levelOf();
  if (after.n > before) setTimeout(() => levelUp(after), 500);

}

/* ---------- sound fx ---------- */

  ctx: null,
  ac() { try { this.ctx ||= new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === "suspended") this.ctx.resume(); return this.ctx; } catch { return null; } },

function confetti() {
  const cv = $("#fx"), c = cv.getContext("2d"); const dpr = Math.min(2, devicePixelRatio || 1);

const Voice = {

function quiz(epId, after) {
  const q = QUIZ[epId]; if (!q) { after?.(); return; }
  const [question, opts, right, why] = q; const hue = P.item?.hue ?? 265;
  const m = $("#modal");
  m.innerHTML = `<div class="modal"><div class="box"><span class="badge" style="justify-self:start">שאלה אחת · 10 נק׳</span><h3>${esc(question)}</h3>${opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}<button class="mini" data-skip style="justify-self:start">דלג</button></div></div>`;
  playLines("שאלה על הפרק", "חידון", hue, [["B", question], ...opts.map((o, i) => ["A", `${["אחת", "שתיים", "שלוש"][i]}. ${o}`])]);
  m.querySelectorAll("[data-i]").forEach((b) => b.onclick = () => {
    const i = +b.dataset.i; m.querySelectorAll("[data-i]").forEach((x) => { x.disabled = true; if (+x.dataset.i === right) x.classList.add("right"); });
    m.querySelector("[data-skip]")?.remove();
    const ok = i === right; if (!ok) { b.classList.add("wrong"); Sound.wrong(); }
    const prev = S.quiz[epId]; S.quiz[epId] = ok ? 1 : (prev || 2); Store.save();
    if (ok && prev !== 1) { gain(10, "תשובה נכונה"); confetti(); }
    const box = m.querySelector(".box"); const p = document.createElement("p"); p.className = "hint"; p.style.fontSize = "15px"; p.textContent = why; box.appendChild(p);
    const c = document.createElement("button"); c.className = "btn"; c.textContent = "המשך"; c.onclick = () => { m.innerHTML = ""; P.stop(); render(); after?.(); }; box.appendChild(c);
    playLines(ok ? "נכון" : "כמעט", "חידון", hue, [["A", (ok ? "נכון. " : "לא בדיוק. ") + why]]);
  });
  m.querySelector("[data-skip]").onclick = () => { m.innerHTML = ""; P.stop(); after?.(); };
}

const Money = {
  v: { monthly: 1000, years: 25, ret: 6, fee: 0.8, habit: 30 },
  calc() {
    const v = this.v; const n = v.years * 12;
    const fv = (r, dep = v.monthly) => { const m = r / 100 / 12; return m === 0 ? dep * n : dep * ((Math.pow(1 + m, n) - 1) / m); };
    const net = fv(v.ret - v.fee), cheap = fv(v.ret - 0.2), paid = v.monthly * n;
    const fmt = (x) => "₪" + Math.round(x).toLocaleString("he-IL");
    const set = (id, t) => { const el = $("#" + id); if (el) el.textContent = t; };
    set("m-net", fmt(net)); set("m-paid", fmt(paid)); set("m-growth", fmt(net - paid)); set("m-fee", fmt(Math.max(0, cheap - net)));
    const bars = $("#m-bars"); if (bars) { const tot = Math.max(cheap, net); bars.innerHTML = `<i style="width:${100 * paid / tot}%;background:#8fb3ff"></i><i style="width:${100 * Math.max(0, net - paid) / tot}%;background:var(--mint)"></i><i style="width:${100 * Math.max(0, cheap - net) / tot}%;background:var(--rose)"></i>`; }
    const habitFv = fv(v.ret - 0.2, v.habit * 30);
    set("m-habit", fmt(habitFv));
    this.out = { net, paid, cheap, habitFv };
  },
  speak() {
    const o = this.out, v = this.v; if (!o) return; const f = (x) => Math.round(x).toLocaleString("he-IL");

      ["B", `מתוכם הפקדת בעצמך ${f(o.paid)}. כל השאר זו ריבית דריבית.`],
      ["A", `ודמי ניהול של ${v.fee} אחוז, לעומת שתי עשיריות אחוז, עולים לך בערך ${f(Math.max(0, o.cheap - o.net))} שקל. שיחת טלפון אחת לקרן יכולה לחסוך את זה.`],
      ["B", "וזכור: התשואה לא מובטחת, והשוק עולה ויורד. המחשבון מראה כיוון, לא הבטחה."]

  root.querySelectorAll("[data-act]").forEach((b) => b.onclick = (ev) => act(b.dataset.act, b, ev));
  root.querySelectorAll("[data-focus]").forEach((b) => b.onclick = () => { const id = b.dataset.focus; welcomeFocus.has(id) ? welcomeFocus.delete(id) : welcomeFocus.add(id); b.classList.toggle("on"); });
  root.querySelectorAll("[data-pfocus]").forEach((b) => b.onclick = () => { const f = S.profile.focus; const i = f.indexOf(b.dataset.pfocus); i >= 0 ? f.splice(i, 1) : f.push(b.dataset.pfocus); b.classList.toggle("on"); });
  root.querySelectorAll("[data-q]").forEach((b) => b.onclick = () => { $("#askq").value = b.dataset.q; askNow(); });
  root.querySelectorAll("[data-replay]").forEach((b) => b.onclick = () => { const h = S.history[+b.dataset.replay]; if (h) speakAnswer(h); });
  root.querySelectorAll("[data-forget]").forEach((b) => b.onclick = () => { S.memory.splice(+b.dataset.forget, 1); Store.save(); render(); });
  root.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => { coachMode = b.dataset.mode; VO.status = ""; render(); });
  root.querySelectorAll("[data-rp]").forEach((b) => b.onclick = () => startRP(b.dataset.rp));
  root.querySelectorAll("[data-eng]").forEach((b) => b.onclick = () => { S.settings.engine = b.dataset.eng; Store.save(); render(); });
  root.querySelectorAll("[data-fl]").forEach((b) => b.onclick = () => { if (b.disabled) return; Face.lvl = +b.dataset.fl; root.querySelectorAll("[data-fl]").forEach((x) => x.classList.toggle("on", x === b)); });
  root.querySelectorAll("[data-br]").forEach((b) => b.onclick = () => Breath.start(+b.dataset.br));
  root.querySelectorAll("[data-m]").forEach((r) => r.oninput = () => { Money.v[r.dataset.m] = +r.value; $("#mv-" + r.dataset.m).textContent = (+r.value).toLocaleString("he-IL") + r.dataset.unit; if (r.dataset.m === "years") $("#mv-years2").textContent = r.value; Money.calc(); });
  root.querySelectorAll("[data-rate]").forEach((b) => b.onclick = () => { S.settings.rate = +b.dataset.rate; if (P.audio) P.audio.playbackRate = S.settings.rate; Store.save(); root.querySelectorAll("[data-rate]").forEach((x) => x.classList.toggle("on", x === b)); if (P.playing && P.item.kind !== "file") { P.run++; Voice.stop(); P.play(); } });
  const f = root.querySelector("#askf"); if (f) { f.onsubmit = (e) => { e.preventDefault(); askNow(); }; autosize($("#askq"), askNow); }
  const rf = root.querySelector("#rpf"); if (rf) { rf.onsubmit = (e) => { e.preventDefault(); rpSend(); }; autosize($("#rpq"), rpSend); }
  const rate = root.querySelector("#p-rate"); if (rate) rate.oninput = () => { S.settings.rate = +rate.value; $("#rateV").textContent = "×" + rate.value; Store.save(); };
  const vs = root.querySelector("#p-voice"); if (vs) vs.onchange = () => { S.settings.voice = vs.value; Store.save(); };
}
function autosize(ta, submit) { ta.oninput = () => { ta.style.height = "auto"; ta.style.height = Math.min(140, ta.scrollHeight) + "px"; }; ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); } }; }
function act(a, b) {
  const dp = dayPlan();
  switch (a) {
    case "drawer": openDrawer(); break;
    case "start": {
      const n = $("#w-name").value.trim(); S.profile.name = n; S.profile.focus = [...welcomeFocus]; if (!n) S.profile.skipped = true;
      delete S.days[today()]; Store.save(); go("home"); Sound.chime();
      playLines("ברוכים הבאים", "היכרות", 280, [
        ["A", `${n ? "היי {name}, " : "היי, "}אני מאיה.`], ["B", "ואני דניאל. אנחנו נלווה אותך כאן."],
        ["A", "כל נושא בנוי מפרקים קצרים. לא צריך לקרוא כלום, רק לשמוע. ובסוף כל פרק יש שאלה אחת, כי ככה הזיכרון נבנה."],
        ["B", "יש גם מעבדות: מעבדת פנים שמאמנת אותך לזהות הבעות בשבריר שנייה, נשימה מודרכת, ומחשבון שמראה כמה הכסף שלך יכול לצמוח."],
        ["A", "ויש מאמן. אפשר לשאול אותו הכל, או לתרגל איתו שיחה קשה, כמו בקשת העלאה, ולקבל ציון ומשוב."],
        ["B", "כל דבר שאתה עושה מקדם אותך ברמות. והכל כאן מבוסס מחקר. כשהמחקר לא חד, נגיד לך. כל בוקר לוחצים על הכפתור הזהוב הגדול, ואנחנו עושים את השאר."]
      ]);
      break;
    }
    case "daily": {
      const nx = nextEpisode();
      if (!nx) { go("coach"); break; }
      const h = new Date().getHours(); const part = h < 12 ? "בוקר" : h < 17 ? "צהריים" : "ערב";
      const lines = [["A", `${sayName() ? "{name}, " : ""}${part} של צמיחה. הנה היום שלך.`]];
      const open = dp.items.filter((i) => !i.done);
      lines.push(["B", open.length ? `יש לך ${open.length === 1 ? "משימה אחת" : open.length === 2 ? "שתי משימות" : "שלוש משימות"} להיום.` : "סיימת כבר את כל המשימות של היום. יפה מאוד."]);
      open.forEach((it, k) => lines.push([k % 2 ? "B" : "A", it.text]));
      lines.push(["A", `ועכשיו, הפרק שלך: ${TOPIC[nx.t].episodes[nx.e].title}.`]);
      setHue(TOPIC[nx.t].hue);
      P.load({ kind: "lines", title: "האימון של היום", sub: "תדריך", hue: TOPIC[nx.t].hue, lines, onEnd: () => playEpisode(nx.t, nx.e, nx.from) });
      openSheet(); break;
    }
    case "say-tasks": playLines("המשימות של היום", "היום שלך", 40, dp.items.map((it, k) => [k % 2 ? "B" : "A", `משימה ${["ראשונה", "שנייה", "שלישית", "רביעית", "חמישית"][k] || k + 1}. ${it.text}`])); break;
    case "say-task": { const it = dp.items[+b.dataset.k]; playLines("משימה", TOPIC[it.topic]?.title || "", TOPIC[it.topic]?.hue || 40, [["A", it.text], ...(it.why ? [["B", it.why]] : [])]); break; }
    case "check": {
      const it = dp.items[+b.dataset.k]; it.done = !it.done; Store.save();
      if (it.done) { if (!it.paid) { it.paid = true; gain(20, "משימה בוצעה"); } if (dp.items.every((i) => i.done)) { confetti(); setTimeout(() => toast("כל המשימות של היום בוצעו"), 1800); } }
      render(); break;
    }
    case "ai-task": {
      b.disabled = true; b.innerHTML = I.spark + " חושב...";
      AI.task().then((r) => {
        if (!r?.task) throw new Error("empty");
        const topic = TOPIC[r.topic] ? r.topic : "confidence";
        dayPlan().items.push({ i: -1, topic, text: r.task, why: r.why || "", done: false, ai: true }); Store.save(); render();
        playLines("משימה אישית", "מהמאמן", TOPIC[topic].hue, [["A", r.task], ...(r.why ? [["B", r.why]] : [])]);
      }).catch((e) => { toast(aiErr(e)); render(); });
      break;
    }
    case "toggle": P.toggle(); break;
    case "skip": P.skip(+b.dataset.d); break;
    case "sheet": openSheet(); break;
    case "close-sheet": closeSheet(); break;
    case "close-player": P.stop(); break;
    case "caps": S.settings.captions = !S.settings.captions; Store.save(); toast(S.settings.captions ? "טקסט מוצג" : "טקסט מוסתר"); paint(); if (view.name === "coach") render(); break;
    case "vo": if (VO.active) { speakGen++; Voice.stop(); VO.set("עצרתי. לחץ שוב כדי לשמוע.", false); } else if (coachMode === "rp" && RP) { const t = [...RP.turns].reverse().find((x) => !x.me); if (t) speakText(t.text, "B", "תורך."); } else { const h = S.history.slice(-1)[0]; if (h) speakAnswer(h); else $("#askq")?.focus(); } break;
    case "replay": { const h = S.history.slice(-1)[0]; if (h) speakAnswer(h); break; }
    case "show-text": { const t = $("#ansText"); t.hidden = !t.hidden; break; }
    case "add-task": { const h = S.history.slice(-1)[0]; if (h?.task) { dayPlan().items.push({ i: -1, topic: guessTopic(h.q), text: h.task, done: false, ai: true }); h.task = ""; Store.save(); toast("נוסף למשימות של היום"); render(); } break; }
    case "save-profile": S.profile.name = $("#p-name").value.trim(); S.profile.say = $("#p-say").value.trim(); S.profile.about = $("#p-about").value.trim(); delete S.profile.skipped; Store.save(); toast("נשמר"); render(); break;
    case "test-name": S.profile.say = $("#p-say").value.trim(); S.profile.name = $("#p-name").value.trim() || S.profile.name; Store.save(); playLines("השם שלך", "בדיקה", 265, [["A", "היי {name}, ככה אני אומרת את השם שלך."]]); break;
    case "test-voice": playLines("בדיקת קול", "הגדרות", 265, [["A", "היי {name}, ככה אני נשמעת."], ["B", "וככה אני נשמע."]]); break;
    case "nb-go": copySource(b.dataset.arg); break;
    case "nb-up": $("#audioIn").dataset.topic = b.dataset.arg; $("#audioIn").click(); break;
    case "nb-how": playLines("פודקאסט עומק אנושי", "NotebookLM", 220, [
      ["A", "NotebookLM של גוגל הופך חומר לפודקאסט של שני מגישים, בקול אנושי לגמרי. זה חינמי."],
      ["B", "לוחצים על העתק חומר ופתח. החומר של הנושא מועתק, ו-NotebookLM נפתח."],
      ["A", "שם יוצרים מחברת חדשה, מוסיפים מקור מסוג טקסט שהועתק, ומדביקים."],
      ["B", "אחר כך לוחצים על סקירת אודיו, בוחרים עברית בהגדרות השפה, ומחכים כמה דקות."],
      ["A", "מורידים את הקובץ, חוזרים לכאן, ולוחצים על הוסף את הפודקאסט. הוא יופיע בנושא, ותקבל עליו נקודות כשתשמע אותו עד הסוף."]
    ]); break;
    case "face-go": Face.start(); break;
    case "face-how": playLines("מעבדת פנים", "איך זה עובד", 340, [["A", "תראה פנים רגועות. לשבריר שנייה תופיע הבעה, ותיעלם."], ["B", "בחר איזה רגש ראית. אחרי כל תשובה ההבעה מוצגת שוב, עם הרמזים שמזהים אותה."], ["A", "חמישה נכונים ברצף פותחים רמה מהירה יותר. ברמת מיקרו זה פחות מחמישית שנייה, כמו מיקרו-הבעה אמיתית."], ["B", "זה אימון לזיהוי רגשות, לא גלאי שקר. ככה תשים לב מתי מישהו קרוב אליך מסתיר משהו, ותדע לשאול ברכות."]]); break;
    case "m-speak": Money.speak(); break;
    case "br-stop": Breath.stop(); break;
    case "rp-exit": RP = null; VO.status = ""; speakGen++; Voice.stop(); render(); break;
    case "rp-again": startRP(RP.rp.id); break;
    case "rp-end": rpEnd(); break;
  }
}
function guessTopic(q) { const m = [["body-language", /גוף|תנוע|ידיים|עמיד/], ["faces", /פנים|הבע|חיוך/], ["saving", /חיסכ|לחסוך|חוב|מינוס|פנסי/], ["earning", /הכנס|משכורת|העלא|עסק|לקוח/], ["relationship", /זוג|אישה|חברה|בת ה|אהב/], ["body", /שינה|כושר|אימון|אוכל|תזונ/], ["presence", /נוכח|לחץ|נשימ|קשב/]]; for (const [id, re] of m) if (re.test(q)) return id; return "confidence"; }

let speakGen = 0;
async function speakText(text, who = "A", doneMsg = "") {
  P.pause(); Voice.stop(); const my = ++speakGen; VO.set("מדבר...", true); let all = true;
  for (const s of sentences(text)) { let ok; try { ok = await Voice.speak(s, who); } catch { ok = false; } if (!ok || my !== speakGen) { all = false; break; } }
  if (my === speakGen) VO.set(all ? doneMsg : "עצרתי. לחץ על העיגול כדי לשמוע שוב.", false);
}
function speakAnswer(h) { return speakText(h.a, "A", h.task ? "המשימה שלך: " + h.task : "שאל עוד שאלה."); }
async function askNow() {
  const ta = $("#askq"); const q = ta.value.trim(); if (!q) { ta.focus(); return; }
  $("#asks").disabled = true; P.pause(); Voice.stop(); VO.set("חושב על זה...", true);
  try {
    const r = await AI.ask(q);
    const h = { q, a: r.answer.trim(), task: (r.task || "").trim(), at: Date.now() };
    S.history.push(h); if (S.history.length > 40) S.history.splice(0, S.history.length - 40);
    for (const m of (Array.isArray(r.remember) ? r.remember : [])) if (typeof m === "string" && m.trim() && !S.memory.includes(m.trim())) S.memory.push(m.trim());
    if (S.memory.length > 30) S.memory.splice(0, S.memory.length - 30);
    markActive(); Store.save(); render(); speakAnswer(h); gain(5, "שאלה טובה");
  } catch (e) { VO.set(aiErr(e), false); const b = $("#asks"); if (b) b.disabled = false; }
}
function startRP(id) { const rp = ROLEPLAYS.find((r) => r.id === id); if (!rp) return; RP = { rp, turns: [{ me: false, text: rp.open }] }; coachMode = "rp"; if (view.name !== "coach") view = { name: "coach" }; closeDrawer(); render(); window.scrollTo({ top: 0 }); speakText(rp.open, "B", "תורך. מה אתה עונה?"); }
async function rpSend() {
  const ta = $("#rpq"); const text = ta.value.trim(); if (!text || !RP) return;
  RP.turns.push({ me: true, text }); render(); VO.set("חושב...", true); $("#rps").disabled = true;
  try { const reply = await AI.roleTurn(RP.rp, RP.turns); RP.turns.push({ me: false, text: reply || "..." }); render(); speakText(reply, "B", "תורך."); }
  catch (e) { RP.turns.pop(); render(); VO.set(aiErr(e), false); $("#rpq").value = text; }
}
async function rpEnd() {
  VO.set("מנתח את השיחה...", true);
  try {
    const f = await AI.feedback(RP.rp, RP.turns); RP.fb = { score: Math.max(1, Math.min(10, Math.round(+f.score || 5))), good: f.good || "", improve: f.improve || "", line: f.line || "" };
    if (f.improve) { const m = "בתרגול " + RP.rp.title + ": לשפר " + f.improve; if (!S.memory.includes(m)) S.memory.push(m); if (S.memory.length > 30) S.memory.shift(); }
    markActive(); Store.save(); render(); gain(10 + RP.fb.score * 2, "תרגול שיחה"); if (RP.fb.score >= 8) confetti();
    speakText(f.spoken || `${f.good} ${f.improve}`, "A", "רוצה עוד סיבוב?");
  } catch (e) { VO.set(aiErr(e), false); }
}
async function copySource(id) {
  const t = TOPIC[id];
  const body = t.episodes.map((e, i) => `פרק ${i + 1}: ${e.title}\n` + e.lines.filter(([w]) => w !== "P").map(([, v]) => v.replaceAll("{name}", nameOf() || "המאזין")).join("\n")).join("\n\n");
  const about = S.profile.about ? `\n\nעל המאזין: ${S.profile.about}` : "";
  const text = `נושא: ${t.title}\n\nהוראות לסקירת האודיו: צרו פודקאסט בעברית, בשיחה טבעית בין שני מגישים, שמעמיק בנושא ${t.title}. הסבירו רק מה שמבוסס במחקר, אמרו במפורש איפה המחקר חלש או שנוי במחלוקת, תנו דוגמאות מהחיים בישראל, וסיימו בתרגיל מעשי אחד להיום.${about}\n\nחומר:\n\n${body}`;
  try { await navigator.clipboard.writeText(text); toast("החומר הועתק. הדבק אותו כמקור ב-NotebookLM"); }
  catch { const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;top:0;left:0;width:100%;height:40vh;z-index:99"; document.body.appendChild(ta); ta.select(); toast("סמן הכל והעתק"); setTimeout(() => ta.remove(), 15000); }
}
$("#audioIn").onchange = async (e) => {
  const f = e.target.files?.[0]; const topic = e.target.dataset.topic; e.target.value = "";
  if (!f || !topic) return;
  try { await Files.add(topic, f); toast("הפודקאסט נשמר ב" + TOPIC[topic].title); if (view.name === "topic") loadOwnAudio(topic); }
  catch { toast("לא הצלחתי לשמור את הקובץ במכשיר הזה"); }
};
$("#scrim").onclick = closeDrawer;
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#drawer").classList.contains("on")) { e.preventDefault(); closeDrawer(); } });
document.addEventListener("visibilitychange", () => { if (document.hidden) Store.save(); });

async function waitClaude(ms = 2000) { const t0 = Date.now(); while (!window.claude?.use && Date.now() - t0 < ms) await new Promise((r) => setTimeout(r, 100)); }
(async function boot() {
  try { const v = JSON.parse(localStorage.getItem("growth.view") || "null"); if (v?.name && v.name !== "coach" && (v.name !== "topic" || TOPIC[v.arg])) view = { name: v.name, arg: v.arg }; } catch {}
  render();
  await waitClaude();
  await Voice.init();
  await Store.init();
  render();
})();
</script>

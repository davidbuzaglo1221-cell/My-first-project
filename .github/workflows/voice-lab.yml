# Voice-cloning lab: clones the reference voices with F5-TTS Hebrew on a CPU runner, scores them with Hebrew ASR,
# and pushes the recordings and report to the voice-lab-out branch.
name: Voice lab
on:
  workflow_dispatch:
  push:
    branches: [claude/ascend-app-build-52sxwe]
    paths: ['ascend/voice-lab/**', '.github/workflows/voice-lab.yml']
permissions:
  contents: write
jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install --quiet torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: |
          printf 'torch==2.5.1\ntorchaudio==2.5.1\n' > /tmp/pin.txt
          pip install --quiet -c /tmp/pin.txt --extra-index-url https://download.pytorch.org/whl/cpu f5-tts phonikud-onnx faster-whisper librosa soundfile omegaconf
          pip uninstall -y -q torchcodec || true
          python -c "import torch, torchaudio; print(torch.__version__, torchaudio.__version__)"
      - run: python ascend/voice-lab/clone.py
      - name: Publish results
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r ascend/voice-lab/out/* /tmp/res/ 2>/dev/null || true
          git config user.name "voice-lab" && git config user.email "voice-lab@users.noreply.github.com"
          git checkout --orphan voice-lab-out && git rm -rqf . && cp -r /tmp/res/* . 2>/dev/null || echo none > none.txt
          git add -A && git commit -qm "voice lab results" && git push -f origin voice-lab-out

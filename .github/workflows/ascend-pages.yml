# Builds the ASCEND web app (ascend/) and publishes it to GitHub Pages.
# Needs: repository public (or GitHub Pro), and Settings → Pages → Source: "GitHub Actions".
name: Deploy הספריה to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['ascend/**', '.github/workflows/ascend-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ascend-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ascend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ascend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:pwa
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ascend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
